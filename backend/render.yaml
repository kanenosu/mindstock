services:
  - type: web
    name: mindstock-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      # 解析・音声入力の両方で使う（必須）。
      - key: OPENAI_API_KEY
        sync: false
      - key: MODEL
        value: gpt-5.1
