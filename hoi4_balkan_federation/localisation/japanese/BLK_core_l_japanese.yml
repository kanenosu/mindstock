 ### ブックマーク
 BLK_BOOKMARK_NAME:0 "連邦の黎明"
 BLK_BOOKMARK_DESC:0 "1936年1月1日。マルセイユの銃弾から1年余り、ベオグラードとソフィアは積年の対立を乗り越え、ティラナを加えてバルカン連邦を結成した。三つの王冠が一つの評議会に座り、クロアチア人もマケドニア人も、それぞれの未来を問うている。半島の外では、ローマとブダペストが新たな隣人を疑いの目で見つめている。"
 BLK_BOOKMARK_HISTORY:0 "1934年、マルセイユで国王アレクサンダル1世が暗殺され、同年のクーデタでブルガリアにはズヴェノ将校団の政権が生まれた。摂政パヴレとキモン・ゲオルギエフは急速に接近し、1935年3月の「ベオグラード＝ソフィア連合条約」でユーゴスラヴィアとブルガリアの統合が決まる。イタリアの経済的締め付けに苦しむアルバニアのゾグ1世も同年秋に加盟を決断し、ここにバルカン連邦が成立した。\n\n連邦は三君主の「三王評議会」が元首を務める奇妙な体制で、セルビア中央集権派、クロアチア農民党、ブルガリア将校団、そして地下の共産主義者が次の進路を争っている。北のハンガリー、西のイタリアは敵意を隠さず、ギリシャとルーマニアは不安げに様子を伺う。連邦を半島の守護者とするか、民主主義の砦とするか、将校団の国家とするか、それとも赤い旗の下に統一するか。選択はあなたの手にある。"
 BLK_BOOKMARK_GER:0 "ドイツはヴェルサイユ体制の打破を目指す。バルカンの新国家は、資源の供給源であると同時に、東南欧進出の障害でもある。"
 BLK_BOOKMARK_ITA:0 "アドリア海の対岸に大国が出現した。ムッソリーニはアルバニアの港と「わが海」の支配を諦めていない。"
 BLK_BOOKMARK_SOV:0 "バルカンには強力な共産党組織がある。モスクワはディミトロフを通じて連邦の赤化を夢見る。"
 BLK_BOOKMARK_ENG:0 "イギリスにとってバルカン連邦は地中海の安定装置になりうる。ただし、それが友好的である限りにおいて。"
 BLK_BOOKMARK_FRA:0 "フランスの東方同盟網は再編を迫られている。小協商の盟友ユーゴスラヴィアは、今やより大きな連邦の一部だ。"
 BLK_BOOKMARK_GRE:0 "北の国境線の向こうに巨人が立った。メタクサス将軍は協調か警戒かを決めねばならない。"
 BLK_BOOKMARK_ROM:0 "南ドブロジャをめぐる旧ブルガリアの要求は、今や連邦の要求となった。"
 BLK_BOOKMARK_HUN:0 "トリアノンの失地回復を狙うハンガリーの南には、以前より遥かに大きな隣人がいる。"
 BLK_BOOKMARK_TUR:0 "トラキア国境の向こうに新たな連邦が生まれた。アンカラは海峡の安全を最優先する。"
 ### 国民精神
 BLK_unfinished_federation:0 "未完の連邦"
 BLK_unfinished_federation_desc:0 "連邦は条約の上では成立したが、行政機構も通貨も学校制度も統一されていない。セルビア人とブルガリア人の官僚は互いを信用せず、クロアチア人とアルバニア人は自治を求めている。"
 BLK_unfinished_federation_2:0 "統合途上の連邦"
 BLK_unfinished_federation_2_desc:0 "統合は進みつつあるが、連邦政府の権威はまだ各構成国に完全には及んでいない。"
 BLK_polyglot_army:0 "多言語の軍隊"
 BLK_polyglot_army_desc:0 "連邦軍はセルビア語、ブルガリア語、クロアチア語、スロヴェニア語、アルバニア語で命令が飛び交う。参謀本部は二つあり、教範は三種類ある。"
 BLK_polyglot_army_2:0 "統合途上の軍隊"
 BLK_polyglot_army_2_desc:0 "共通の指揮言語と教範の整備が始まったが、現場ではなお混乱が残る。"
 BLK_council_of_crowns:0 "三王評議会"
 BLK_council_of_crowns_desc:0 "摂政パヴレ、ツァーリ・ボリス3世、ゾグ1世の三君主が交代で評議会を主宰する。妥協の産物であるこの制度は安定をもたらすが、果断な行動を妨げる。"
 BLK_council_of_crowns_2:0 "制度化された三王評議会"
 BLK_council_of_crowns_2_desc:0 "評議会の権限と手続きが連邦憲法に明記され、三王の合議は連邦の安定の象徴となった。"
 BLK_shadow_of_imro:0 "IMROの影"
 BLK_shadow_of_imro_desc:0 "内部マケドニア革命組織は連邦に敵対し、爆弾テロと暗殺を続けている。マケドニア問題は連邦の火薬庫である。"
 BLK_italian_pressure:0 "イタリアの経済的圧力"
 BLK_italian_pressure_desc:0 "ローマはアルバニアへの投資を引き揚げ、連邦産品に関税をかけた。アドリア海の対岸からの圧力は日ごとに強まっている。"
 BLK_royal_army_oath:0 "連邦軍の忠誠宣誓"
 BLK_royal_army_oath_desc:0 "全将兵が三王評議会と連邦憲法に忠誠を誓った。軍は連邦の背骨である。"
 BLK_armed_neutrality:0 "武装中立"
 BLK_armed_neutrality_desc:0 "連邦はいかなる大国の陣営にも属さず、自らの力で半島を守る。"
 BLK_guardian_of_the_balkans:0 "バルカンの守護者"
 BLK_guardian_of_the_balkans_desc:0 "連邦は半島の秩序の保証人として、諸国から認められている。"
 BLK_federal_democracy:0 "連邦民主主義"
 BLK_federal_democracy_desc:0 "各構成国の自治と連邦議会の権威が両立する、新しい民主主義のかたち。"
 BLK_western_credit:0 "西側借款"
 BLK_western_credit_desc:0 "ロンドンとパリの資本が連邦の鉄道と工場に流れ込んでいる。"
 BLK_federation_of_free_peoples:0 "自由諸民族の連邦"
 BLK_federation_of_free_peoples_desc:0 "バルカンの諸民族が自らの意思で結んだ連邦は、半島史上はじめて民衆の支持に立脚する国家となった。"
 BLK_military_council:0 "軍事評議会"
 BLK_military_council_desc:0 "将校団が政党を解散させ、国家の統一を軍の規律で実現しようとしている。"
 BLK_fortress_balkans:0 "要塞バルカン"
 BLK_fortress_balkans_desc:0 "山岳地帯と沿岸に要塞線が築かれ、半島は難攻不落の要塞と化しつつある。"
 BLK_national_mobilization:0 "国家総動員"
 BLK_national_mobilization_desc:0 "連邦の全産業と人口が軍事目的に動員されている。"
 BLK_third_way:0 "第三の道"
 BLK_third_way_desc:0 "ベルリンにもモスクワにもロンドンにも頼らず、連邦は自らの力で大国に伍する。"
 BLK_greater_balkan_ambition:0 "大バルカンの野望"
 BLK_greater_balkan_ambition_desc:0 "半島のすべてをひとつの旗の下に。将校団はそれを公然と語り始めた。"
 BLK_workers_councils:0 "労働者評議会"
 BLK_workers_councils_desc:0 "工場と鉱山に労働者評議会が組織され、経営に対する発言権を強めている。"
 BLK_socialist_federation:0 "社会主義連邦"
 BLK_socialist_federation_desc:0 "連邦は社会主義諸共和国の連邦として再編された。"
 BLK_partisan_tradition:0 "パルチザンの伝統"
 BLK_partisan_tradition_desc:0 "山岳での遊撃戦の伝統が、新しい人民軍の中核をなしている。"
 BLK_self_management:0 "労働者自主管理"
 BLK_self_management_desc:0 "モスクワ型の中央計画ではなく、労働者自身が企業を管理する独自の社会主義。"
 BLK_comintern_discipline:0 "コミンテルンの規律"
 BLK_comintern_discipline_desc:0 "連邦の党はモスクワの路線に従い、国際共産主義運動の一翼を担う。"
 BLK_balkan_socialist_federation:0 "バルカン社会主義連邦"
 BLK_balkan_socialist_federation_desc:0 "半島のすべての労働者が、ひとつの社会主義連邦の下に結集する。"
 BLK_one_federation_many_peoples:0 "多民族一連邦"
 BLK_one_federation_many_peoples_desc:0 "連邦市民権法と各民族の自治が確立し、連邦はついに名実ともに統一された。"
 BLK_salonika_free_port:0 "テッサロニキ自由港"
 BLK_salonika_free_port_desc:0 "ギリシャとの協定により、連邦はテッサロニキ港を自由に使用できる。"
 BLK_federal_bank:0 "連邦銀行"
 BLK_federal_bank_desc:0 "通貨の統一と連邦銀行の設立により、連邦経済はひとつの市場となった。"
 BLK_industrial_federation:0 "産業連邦"
 BLK_industrial_federation_desc:0 "連邦の工業化計画は軌道に乗り、ザグレブからプロヴディフまで新しい工場が建ち並ぶ。"
 BLK_military_industrial_complex:0 "連邦軍需複合体"
 BLK_military_industrial_complex_desc:0 "クラグイェヴァツとソフィアの兵器廠を中心に、連邦の軍需産業は統合された。"
 BLK_federal_army:0 "連邦軍"
 BLK_federal_army_desc:0 "統一された指揮系統を持つ連邦軍。"
 BLK_unified_general_staff:0 "統合参謀本部"
 BLK_unified_general_staff_desc:0 "ベオグラードとソフィアの参謀本部が統合され、ひとつの作戦計画が立てられるようになった。"
 BLK_mountain_warfare:0 "山岳戦の伝統"
 BLK_mountain_warfare_desc:0 "バルカン山脈とディナル・アルプスで鍛えられた山岳部隊は連邦軍の精鋭である。"
 BLK_frontier_fortifications:0 "国境要塞線"
 BLK_frontier_fortifications_desc:0 "北部国境に築かれた要塞線が、連邦の心臓部を守る。"
 BLK_air_defence_network:0 "防空網"
 BLK_air_defence_network_desc:0 "レーダーと高射砲による防空網が主要都市を覆っている。"
 BLK_adriatic_fleet:0 "アドリア艦隊"
 BLK_adriatic_fleet_desc:0 "スプリトとコトルを母港とする連邦海軍は、アドリア海の沿岸防衛を担う。"
 BLK_balkan_shield:0 "バルカンの盾"
 BLK_balkan_shield_desc:0 "連邦軍は半島の盾として、いかなる侵略にも立ち向かう覚悟を固めた。"
 BLK_general_mobilization_drive:0 "国民皆兵"
 BLK_general_mobilization_drive_desc:0 "村ごとの民兵組織が連邦軍の予備となっている。"
 HUN_southern_threat:0 "南方の脅威"
 HUN_southern_threat_desc:0 "ハンガリーの南に、以前のユーゴスラヴィアより遥かに大きな連邦が出現した。"
 ITA_adriatic_rivalry:0 "アドリア海の競合"
 ITA_adriatic_rivalry_desc:0 "「わが海」の対岸にバルカン連邦が立ちはだかる。ローマはそれを許容しない。"
 GRE_northern_colossus:0 "北の巨人"
 GRE_northern_colossus_desc:0 "北の国境のすべてがひとつの大国に接することになった。"
 GRE_balkan_partnership:0 "バルカン・パートナーシップ"
 GRE_balkan_partnership_desc:0 "連邦との協力関係が通商と安全保障の両面で実を結んでいる。"
 ROM_dobruja_vigilance:0 "ドブロジャ警戒"
 ROM_dobruja_vigilance_desc:0 "南ドブロジャへの連邦の要求に備え、ルーマニアは南部国境を固めている。"
 ROM_balkan_partnership:0 "バルカン・パートナーシップ"
 ROM_balkan_partnership_desc:0 "連邦との協力関係が通商と安全保障の両面で実を結んでいる。"
 TUR_western_federation:0 "西の連邦"
 TUR_western_federation_desc:0 "トラキア国境の向こうの連邦に対し、トルコは警戒と協調の両面で備えている。"
 GER_balkan_resources:0 "バルカン資源協定"
 GER_balkan_resources_desc:0 "バルカン連邦との通商協定により、クロムとボーキサイトがドイツに流れ込む。"
 ### 指導者特性
 BLK_regent_chairman:0 "摂政評議会議長"
 BLK_regent_chairman_desc:0 "三王評議会の議長として連邦の均衡を保つ。"
 BLK_boy_king:0 "若き連邦王"
 BLK_boy_king_desc:0 "成年に達した若き王は、連邦の統一の象徴である。"
 BLK_peasant_tribune:0 "農民の護民官"
 BLK_peasant_tribune_desc:0 "農民運動の指導者として民衆の支持を集める。"
 BLK_zveno_officer:0 "ズヴェノ将校"
 BLK_zveno_officer_desc:0 "政党政治を嫌い、軍の規律による国家建設を信じる。"
 BLK_general_of_the_crown:0 "王冠の将軍"
 BLK_general_of_the_crown_desc:0 "旧王国軍の参謀総長として軍の忠誠を集める。"
 BLK_partisan_marshal:0 "パルチザンの元帥"
 BLK_partisan_marshal_desc:0 "山岳遊撃戦の名手にして、民族を超えた連帯の体現者。"
 BLK_comintern_veteran:0 "コミンテルンの古参"
 BLK_comintern_veteran_desc:0 "ライプツィヒ裁判の英雄にして、コミンテルンの書記長。"
