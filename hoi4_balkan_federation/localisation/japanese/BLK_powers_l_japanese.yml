l_japanese:
 ### 決定カテゴリ
 ITA_adriatic_policy:0 "アドリア海政策"
 HUN_southern_policy:0 "南方政策"
 GER_southeast_sphere:0 "東南欧経済圏"
 TUR_straits_federation:0 "海峡と連邦"
 SOV_balkan_operations:0 "バルカン工作"
 ### イタリアの決定
 ita_support_albanian_exiles:0 "アルバニア亡命者の支援"
 ita_support_albanian_exiles_desc:0 "ゾグ王に追われた亡命者たちをバーリで組織し、アルバニアの不安定化を図る。"
 ita_shelter_ustasa:0 "ウスタシャの庇護"
 ita_shelter_ustasa_desc:0 "パヴェリッチとウスタシャの訓練所をイタリア国内で維持するか決める。"
 ita_naval_demonstration:0 "ドゥラス沖の艦隊示威"
 ita_naval_demonstration_desc:0 "艦隊をアルバニア沿岸に派遣し、連邦に「わが海」の現実を思い知らせる。"
 ita_fortify_zara:0 "ザラの要塞化"
 ita_fortify_zara_desc:0 "ダルマチア沿岸の飛び地ザラを海岸要塞で固める。"
 ita_eastern_shore_program:0 "東岸計画"
 ita_eastern_shore_program_desc:0 "アドリア海東岸の回復を見据え、海軍と沿岸基地を強化する。"
 ita_albanian_question_decision:0 "アルバニア問題の最終決断"
 ita_albanian_question_decision_desc:0 "戦争か、取引か、断念か。アルバニアをめぐる連邦との対立に決着をつける。"
 ### ハンガリーの決定
 hun_southern_fortifications:0 "南部国境の要塞化"
 hun_southern_fortifications_desc:0 "ドナウとドラヴァの線に陣地を築く。"
 hun_vojvodina_propaganda:0 "ヴォイヴォディナ宣伝工作"
 hun_vojvodina_propaganda_desc:0 "バチュカのハンガリー人住民に向けて失地回復の宣伝を流す。"
 hun_vojvodina_plebiscite:0 "ヴォイヴォディナ住民投票"
 hun_vojvodina_plebiscite_desc:0 "連邦が提案した住民投票を実施する。結果は保証されていない。"
 hun_german_coordination:0 "ドイツとの南方協調"
 hun_german_coordination_desc:0 "ベルリンと歩調を合わせ、連邦への圧力を強める。"
 ### ドイツの決定
 ger_trade_pressure:0 "通商圧力"
 ger_trade_pressure_desc:0 "連邦に清算協定方式の通商条約を迫る。"
 ger_volksdeutsche_support:0 "ドナウ・シュヴァーベン人の支援"
 ger_volksdeutsche_support_desc:0 "ヴォイヴォディナのドイツ系住民の文化団体を支援する。"
 ger_bauxite_contract:0 "ボーキサイト長期契約"
 ger_bauxite_contract_desc:0 "連邦のボーキサイトとクロムを長期契約で確保する。"
 ger_military_mission:0 "軍事顧問団の派遣"
 ger_military_mission_desc:0 "連邦の軍事評議会に顧問団を派遣し、影響力を築く。"
 ### トルコの決定
 tur_extradite_mihailov:0 "ミハイロフの処遇"
 tur_extradite_mihailov_desc:0 "イスタンブールに亡命中のIMRO指導者イヴァン・ミハイロフの処遇を決める。"
 tur_straits_guarantee:0 "海峡協約の保証"
 tur_straits_guarantee_desc:0 "連邦と海峡の安全保障に関する保証を交わす。"
 tur_black_sea_exercises:0 "黒海合同演習"
 tur_black_sea_exercises_desc:0 "連邦海軍と黒海で合同演習を行う。"
 ### ソ連の決定
 sov_comintern_agents:0 "コミンテルン工作員の派遣"
 sov_comintern_agents_desc:0 "連邦の党組織にコミンテルンの工作員を送り込む。"
 sov_fund_party_press:0 "党機関紙への資金援助"
 sov_fund_party_press_desc:0 "連邦の共産党機関紙と労働組合に資金を流す。"
 sov_balkan_volunteers:0 "バルカン義勇兵の募集"
 sov_balkan_volunteers_desc:0 "スペイン共和国のために連邦から義勇兵を募る。"
 ### 国民精神
 ITA_ustasa_patron:0 "ウスタシャの庇護者"
 ITA_ustasa_patron_desc:0 "パヴェリッチのウスタシャはイタリアの訓練所で連邦への攻撃を準備している。"
 ITA_albanian_exiles:0 "アルバニア亡命者"
 ITA_albanian_exiles_desc:0 "バーリに集まったゾグ王の政敵たちは、イタリアの対連邦政策の道具である。"
 ITA_eastern_shore_doctrine:0 "東岸教義"
 ITA_eastern_shore_doctrine_desc:0 "「わが海」はアドリア海の両岸を含む。海軍はその回復のために建設される。"
 ITA_albanian_settlement:0 "アルバニア問題の決着"
 ITA_albanian_settlement_desc:0 "ローマはアルバニアを諦め、地中海の他の方面に目を向けた。"
 HUN_southern_policy_axis:0 "南方政策：枢軸との連携"
 HUN_southern_policy_axis_desc:0 "ハンガリーはドイツと歩調を合わせ、連邦に圧力をかける。"
 HUN_southern_policy_detente:0 "南方政策：連邦との和解"
 HUN_southern_policy_detente_desc:0 "ハンガリーは連邦との対立を棚上げし、北と東に目を向けた。"
 HUN_plebiscite_grievance:0 "住民投票の遺恨"
 HUN_plebiscite_grievance_desc:0 "ヴォイヴォディナの住民投票は不正だった、と誰もが信じている。"
 GER_southeast_economic_sphere:0 "東南欧経済圏"
 GER_southeast_economic_sphere_desc:0 "バルカンはドイツの原料供給地であり、工業製品の市場である。"
 GER_danube_swabian_ties:0 "ドナウ・シュヴァーベン人との絆"
 GER_danube_swabian_ties_desc:0 "ヴォイヴォディナのドイツ系住民はベルリンの影響下にある。"
 GER_balkan_military_mission:0 "バルカン軍事顧問団"
 GER_balkan_military_mission_desc:0 "ドイツの将校が連邦軍の近代化を指導している。"
 SOV_balkan_section:0 "コミンテルン・バルカン部"
 SOV_balkan_section_desc:0 "コミンテルンのバルカン部は連邦の党組織を直接指導している。"
 TUR_montreux_secured:0 "モントルー体制"
 TUR_montreux_secured_desc:0 "海峡の主権は回復された。"
 TUR_mihailov_affair:0 "ミハイロフ事件"
 TUR_mihailov_affair_desc:0 "IMRO指導者の庇護をめぐり、連邦との関係が冷え込んでいる。"
 ENG_mediterranean_watch:0 "地中海の監視"
 ENG_mediterranean_watch_desc:0 "イギリス海軍は地中海の秩序維持に関与を深めている。"
 FRA_eastern_alliance_network:0 "東方同盟網"
 FRA_eastern_alliance_network_desc:0 "フランスの東欧同盟網はバルカン連邦を含めて維持されている。"
 FRA_eastern_alliance_abandoned:0 "東方同盟網の放棄"
 FRA_eastern_alliance_abandoned_desc:0 "ミュンヘン以後、フランスは東欧の同盟国を見捨てた。"
 CZE_little_entente_renewed:0 "再生した小協商"
 CZE_little_entente_renewed_desc:0 "小協商はバルカン連邦を正式な継承者として迎え、再生した。"
 AUS_rome_protocols:0 "ローマ議定書"
 AUS_rome_protocols_desc:0 "オーストリアはイタリアとハンガリーとの協調に依拠している。"
 AUS_danube_cooperation:0 "ドナウ圏協力"
 AUS_danube_cooperation_desc:0 "ウィーンと連邦はドナウ水運と通商で協力している。"
 blk_czech_arms_bonus:0 "シュコダの技術供与"
 ### イタリアのイベント
 blkf.200.t:0 "アルバニア亡命者たち"
 blkf.200.d:0 "バーリとブリンディジには、ゾグ王に追われたアルバニア人の亡命者が集まっている。元首相ファン・ノリの支持者、北部の部族長、そして単なる冒険家たち。彼らは連邦加盟を「ゾグのセルビアへの売国」と呼び、イタリアの支援を求めている。"
 blkf.200.a:0 "亡命者を支援する"
 blkf.200.b:0 "相手にしない"
 blkf.201.t:0 "ウスタシャの庇護"
 blkf.201.d:0 "アンテ・パヴェリッチのウスタシャは、マルセイユ事件以来イタリア国内の訓練所に留め置かれている。連邦はその引き渡しを要求し、フランスも圧力をかけている。しかしウスタシャは連邦のクロアチア地方を揺さぶる格好の道具でもある。"
 blkf.201.a:0 "庇護を続ける"
 blkf.201.b:0 "パヴェリッチを国外退去させる"
 blkf.202.t:0 "ドゥラス沖の艦隊示威"
 blkf.202.d:0 "イタリア艦隊がドゥラス沖に姿を現した。1934年6月の再現である。戦艦と巡洋艦が港の目の前を航行し、連邦の沿岸砲台は沈黙したまま見守った。"
 blkf.202.a:0 "わが海を忘れるな"
 blkf.203.t:0 "ザラの要塞化"
 blkf.203.d:0 "ダルマチア沿岸の飛び地ザラに、海岸砲台と高射砲陣地が完成した。連邦領に囲まれたこの小さな都市は、アドリア海東岸におけるイタリアの楔である。"
 blkf.203.a:0 "ザラはイタリアだ"
 blkf.204.t:0 "アルバニア問題の最終決断"
 blkf.204.d:0 "アルバニアが連邦に加わって3年。ローマはいまだにそれを受け入れていない。亡命者も艦隊示威も、ゾグ王を連邦から引き剥がすことはできなかった。ドゥーチェは決断を迫られている。東岸を力で取り戻すか、港湾使用権で妥協するか、それともアドリア海を諦めて地中海の他の方面に向かうか。"
 blkf.204.a:0 "戦争だ。東岸を取り戻す"
 blkf.204.b:0 "港湾使用権で取引する"
 blkf.204.c:0 "アドリア海東岸を断念する"
 ### ハンガリーのイベント
 blkf.210.t:0 "南方政策の策定"
 blkf.210.d:0 "ゲンベシュ首相は、バルカン連邦に対する「南方政策」の策定を閣議に諮った。ベルリンと連携して圧力をかけるか、連邦との対立を棚上げしてチェコスロヴァキアとルーマニアに集中するか。トリアノンの失地はどこも等しく痛いが、兵力は無限ではない。"
 blkf.210.a:0 "ドイツと連携して圧力をかける"
 blkf.210.b:0 "連邦と和解し、北と東に集中する"
 blkf.210.c:0 "決断を先送りする"
 blkf.212.t:0 "ヴォイヴォディナ住民投票の結果"
 blkf.212.d:0 "バチュカで住民投票が行われた。連邦の監視下、ハンガリー側の立会人の抗議の中で。開票結果が届いた。"
 blkf.212.a:0 "結果を見る"
 blkf.213.t:0 "ドイツからの南方への誘い"
 blkf.213.d:0 "ベルリンからの使者は率直だった。ドイツは連邦に対する「協調的な圧力」を望んでおり、ハンガリーがその先鋒となるなら、ヴォイヴォディナの要求を支持する用意があるという。"
 blkf.213.a:0 "誘いに乗る"
 blkf.213.b:0 "距離を置く"
 ### ドイツのイベント
 blkf.220.t:0 "新たな隣人"
 blkf.220.d:0 "オーストリアの併合により、ドイツはバルカン連邦と直接国境を接することになった。カラヴァンケ山脈の向こうには、2000万を超える人口と二十数個師団を持つ連邦がある。この隣人をどう扱うか。"
 blkf.220.a:0 "友好的な隣人として振る舞う"
 blkf.220.b:0 "国境の重みを思い知らせる"
 blkf.221.t:0 "ミュンヘン後のバルカン経済圏"
 blkf.221.d:0 "ミュンヘン協定は西側の東欧からの撤退を意味した。経済省はこの機会に、バルカン連邦を含む東南欧全域をドイツの経済圏に組み込む構想を提出している。連邦のクロム、ボーキサイト、銅、石油はドイツの再軍備に不可欠だ。"
 blkf.221.a:0 "東南欧経済圏を構築する"
 blkf.221.b:0 "連邦には軍事的圧力で臨む"
 blkf.222.t:0 "ドナウ・シュヴァーベン問題"
 blkf.222.d:0 "ヴォイヴォディナには50万人のドイツ系住民が暮らしている。18世紀に入植した「ドナウ・シュヴァーベン人」たちである。民族ドイツ人連盟は彼らの文化団体を通じて影響力を広げようとしている。"
 blkf.222.a:0 "文化団体を通じて支援する"
 blkf.222.b:0 "連邦との関係を優先する"
 ### ソ連のイベント
 blkf.230.t:0 "ディミトロフの派遣"
 blkf.230.d:0 "コミンテルン書記長ゲオルギ・ディミトロフは、バルカン連邦への帰国を望んでいる。彼のブルガリアでの名声は絶大であり、連邦の党を統一できる唯一の人物かもしれない。しかし、彼をモスクワの手の届かない場所に置くことには危険もある。"
 blkf.230.a:0 "コミンテルン使節として連邦に送る"
 blkf.230.b:0 "モスクワに留め置く"
 blkf.231.t:0 "人民戦線指令"
 blkf.231.d:0 "コミンテルン第7回大会の路線に従い、バルカン連邦の共産党にも人民戦線の結成が指令されることになった。農民党や社会民主主義者との協力は、党の勢力拡大に役立つだろう。だが連邦の党には独自路線を望む声もある。"
 blkf.231.a:0 "人民戦線を命じる"
 blkf.231.b:0 "独自の革命路線を認める"
 blkf.232.t:0 "バルカン義勇兵の募集"
 blkf.232.d:0 "スペインで内戦が始まった。国際旅団への志願者を各国から募るにあたり、バルカン連邦の共産党にも呼びかけるべきだとコミンテルンは考えている。"
 blkf.232.a:0 "連邦に義勇兵の派遣を呼びかける"
 blkf.232.b:0 "見送る"
 ### トルコのイベント
 blkf.240.t:0 "ミハイロフの引き渡し問題"
 blkf.240.d:0 "IMRO指導者イヴァン・ミハイロフは1934年以来イスタンブールに亡命している。連邦は彼の引き渡しを正式に要求してきた。引き渡せば連邦との関係は深まるが、亡命者保護の原則を曲げることになる。"
 blkf.240.a:0 "引き渡す"
 blkf.240.b:0 "亡命者の保護を貫く"
 blkf.241.t:0 "モントルー会議"
 blkf.241.d:0 "海峡の再武装を認めさせるための会議がモントルーで開かれる。黒海沿岸国である連邦の支持は、イギリスとソ連の間で立ち回るうえで有用だろう。"
 blkf.241.a:0 "連邦の支持を取り付ける"
 blkf.241.b:0 "単独で臨む"
 ### 英仏のイベント
 blkf.250.t:0 "ニヨン会議"
 blkf.250.d:0 "地中海で正体不明の潜水艦による商船攻撃が相次いでいる。英仏はニヨンで地中海諸国を集め、共同哨戒を協議する。アドリア海に面するバルカン連邦を招くべきか。"
 blkf.250.a:0 "連邦を地中海哨戒に招く"
 blkf.250.b:0 "英仏だけで進める"
 blkf.251.t:0 "借款の政治条件"
 blkf.251.d:0 "バルカン連邦は鉄道と兵器廠のための借款を求めている。財務省は、借款に政治的条件、すなわちドイツとの通商拡大の抑制と小協商への忠誠を付けることを提案している。"
 blkf.251.a:0 "条件付き借款を提示する"
 blkf.251.b:0 "東方への関与を控える"
 blkf.252.t:0 "地中海保障"
 blkf.252.d:0 "外務省は、バルカン連邦の独立を保証することが地中海東部におけるイタリアとドイツの膨張を抑える最も安価な手段だと主張している。連邦が枢軸に傾いていない限り、保証の費用は小さい。"
 blkf.252.a:0 "連邦の独立を保証する"
 blkf.252.b:0 "関与しない"
 blkf.253.t:0 "ミュンヘンと東方同盟網"
 blkf.253.d:0 "ミュンヘンでチェコスロヴァキアを見捨てたフランスに、東方の同盟国はもはや信を置いていない。バルカン連邦との同盟網を維持するために追加の投資を行うか、それとも東方から手を引くか。"
 blkf.253.a:0 "東方同盟網を維持する"
 blkf.253.b:0 "東方から手を引く"
 ### チェコスロヴァキアのイベント
 blkf.260.t:0 "小協商の存続"
 blkf.260.d:0 "小協商の盟友ユーゴスラヴィアはバルカン連邦の一部となった。ベネシュ大統領は、連邦を小協商の正式な継承者として迎えることを提案している。連邦はユーゴスラヴィアより遥かに強力だが、ブルガリアを含むことでルーマニアとの関係は複雑になる。"
 blkf.260.a:0 "連邦を小協商の継承者として迎える"
 blkf.260.b:0 "距離を置く"
 blkf.261.t:0 "ベネシュの援助要請"
 blkf.261.d:0 "ズデーテン地方をめぐるドイツの圧力は日ごとに強まっている。ベネシュ大統領は小協商の盟友であるバルカン連邦に、独立の保証を求めることを決めた。"
 blkf.261.a:0 "連邦に保証を求める"
 blkf.261.b:0 "西側だけに頼る"
 ### オーストリアのイベント
 blkf.270.t:0 "シュシュニックの警戒"
 blkf.270.d:0 "オーストリアの南に巨大な南スラヴ国家が出現した。シュシュニック首相にとって、それはケルンテンのスロヴェニア人問題を再燃させかねない隣人である。ローマ議定書に依拠してイタリアとハンガリーとの連携を深めるか、連邦との通商に活路を求めるか。"
 blkf.270.a:0 "ローマ議定書に依拠する"
 blkf.270.b:0 "連邦との通商に活路を求める"
 blkf.271.t:0 "ドナウ圏協力の模索"
 blkf.271.d:0 "ドイツの圧力が強まる中、ウィーンはドナウ流域諸国との経済協力に活路を見出そうとしている。バルカン連邦は最大の潜在的パートナーである。"
 blkf.271.a:0 "連邦に打診する"
 blkf.271.b:0 "ローマとベルリンの顔色を伺う"
 ### 連邦側の受信イベント
 blkf.280.t:0 "イタリアの亡命者支援"
 blkf.280.d:0 "イタリアがバーリのアルバニア人亡命者を組織し、武器と資金を与えているとの情報が入った。彼らの目標はゾグ王の打倒と連邦からの離脱である。"
 blkf.280.a:0 "アルバニア憲兵隊を強化する"
 blkf.280.b:0 "ゾグ王に対処を委ねる"
 blkf.281.t:0 "ウスタシャの庇護者"
 blkf.281.d:0 "イタリアはパヴェリッチとウスタシャの庇護を続けることを決めた。訓練所からはクロアチアへの工作員の潜入が続いている。"
 blkf.281.a:0 "ローマに抗議する"
 blkf.281.b:0 "クロアチアの治安を強化する"
 blkf.282.t:0 "ドゥラス沖のイタリア艦隊"
 blkf.282.d:0 "イタリア艦隊がドゥラス沖に現れた。戦艦と巡洋艦が港の目と鼻の先を航行している。アルバニアの沿岸砲台は旧式で、連邦海軍の駆逐艦ではとても太刀打ちできない。"
 blkf.282.a:0 "沿岸部隊を動員する"
 blkf.282.b:0 "挑発に乗らない"
 blkf.284.t:0 "住民投票の敗北"
 blkf.284.d:0 "バチュカの住民投票でハンガリー帰属派が多数を占めた。連邦政府は結果に衝撃を受けている。結果を尊重すれば領土を失い、認めなければ連邦の民主的正統性が傷つく。"
 blkf.284.a:0 "結果を尊重し、バチュカを譲る"
 blkf.284.b:0 "結果を認めない"
 blkf.285.t:0 "ドイツの接近"
 blkf.285.d:0 "オーストリア併合によりドイツと国境を接することになった連邦に、ベルリンから友好の使者が訪れた。ドイツは連邦との「善隣関係」と通商拡大を望んでいるという。"
 blkf.285.a:0 "友好を歓迎する"
 blkf.285.b:0 "警戒を怠らない"
 blkf.286.t:0 "ドイツの通商圧力"
 blkf.286.d:0 "ドイツは清算協定方式の通商条約を迫ってきた。連邦の鉱物と農産物をドイツの工業製品と交換する仕組みで、ドイツへの依存を深める一方、工場建設への投資も約束されている。"
 blkf.286.a:0 "通商条約を結ぶ"
 blkf.286.b:0 "拒否する"
 blkf.287.t:0 "ドイツ経済圏への招請"
 blkf.287.d:0 "ミュンヘン以後、ドイツは東南欧全域を自らの経済圏に組み込もうとしている。連邦への提案は寛大だ。ソフィアとベオグラードへの工場建設、長期の原料契約、そして技術供与。代償は、西側との通商の縮小とベルリンへの経済的従属である。"
 blkf.287.a:0 "経済圏に加わる"
 blkf.287.b:0 "自立を守る"
 blkf.288.t:0 "ドイツ系住民の問題"
 blkf.288.d:0 "ヴォイヴォディナのドイツ系住民の文化団体が、ベルリンの民族ドイツ人連盟から資金を受けていることが判明した。50万人のドナウ・シュヴァーベン人は、これまで連邦に忠実な市民だった。"
 blkf.288.a:0 "文化的権利を認める"
 blkf.288.b:0 "ドイツ系団体を監視下に置く"
 blkf.289.t:0 "ディミトロフの使節"
 blkf.289.d:0 "モスクワはゲオルギ・ディミトロフをコミンテルン使節として連邦に送ると通告してきた。ライプツィヒ裁判の英雄の入国を認めれば、ブルガリアの労働者は熱狂するだろう。拒否すれば、ソ連との関係は冷え込む。"
 blkf.289.a:0 "入国を認める"
 blkf.289.b:0 "入国を拒否する"
 blkf.290.t:0 "スペインへの義勇兵"
 blkf.290.d:0 "ザグレブとソフィアの共産党が、スペイン共和国のための義勇兵を募っている。数百人の若者が国境を越えてパリに向かおうとしている。"
 blkf.290.a:0 "出国を黙認する"
 blkf.290.b:0 "出国を禁じる"
 blkf.291.t:0 "ミハイロフの引き渡し"
 blkf.291.d:0 "トルコはIMRO指導者イヴァン・ミハイロフの引き渡しに応じた。マケドニアのテロ組織の頭目は、今や連邦の手中にある。"
 blkf.291.a:0 "裁判にかける"
 blkf.291.b:0 "恩赦と引き換えにIMROを分裂させる"
 blkf.292.t:0 "モントルーの海峡"
 blkf.292.d:0 "トルコは海峡再武装のための会議で連邦の支持を求めている。黒海沿岸国として、連邦には海峡の自由航行を主張する立場もあるが、アンカラとの友好はそれ以上の価値がある。"
 blkf.292.a:0 "トルコを支持する"
 blkf.292.b:0 "黒海の自由航行を主張する"
 blkf.293.t:0 "ニヨン哨戒への招請"
 blkf.293.d:0 "英仏は地中海の「海賊潜水艦」対策のための共同哨戒に連邦海軍を招いている。参加すれば西側との関係は深まるが、潜水艦の正体がイタリアであることは誰もが知っている。"
 blkf.293.a:0 "参加する"
 blkf.293.b:0 "辞退する"
 blkf.294.t:0 "フランス借款の政治条件"
 blkf.294.d:0 "パリは鉄道と兵器廠のための借款を提示したが、条件が付いている。ドイツとの通商拡大の抑制と、小協商への忠誠の確認である。"
 blkf.294.a:0 "条件を受け入れる"
 blkf.294.b:0 "拒否する"
 blkf.295.t:0 "フランスの撤退"
 blkf.295.d:0 "フランスは東方同盟網から手を引くことを決めた。ミュンヘンでチェコスロヴァキアを見捨てた国は、バルカン連邦も見捨てた。連邦は自らの力で立つしかない。"
 blkf.295.a:0 "自力で立つ"
 blkf.295.b:0 "ベルリンとの関係を見直す"
 blkf.296.t:0 "ベネシュの提案"
 blkf.296.d:0 "チェコスロヴァキアのベネシュ大統領は、連邦を小協商の正式な継承者として迎えると提案してきた。シュコダの兵器と技術供与が約束されている。"
 blkf.296.a:0 "小協商を引き継ぐ"
 blkf.296.b:0 "過去の同盟には縛られない"
 blkf.297.t:0 "チェコスロヴァキアへの保証"
 blkf.297.d:0 "ズデーテン危機の中、プラハは連邦に独立の保証を求めてきた。保証を与えればドイツとの対立は避けられないが、拒否すれば小協商は死ぬ。"
 blkf.297.a:0 "保証を与える"
 blkf.297.b:0 "遺憾ながら断る"
 blkf.298.t:0 "ウィーンからの打診"
 blkf.298.d:0 "オーストリアがドナウ水運と通商での協力を打診してきた。ドイツの圧力に苦しむウィーンにとって、連邦は最後の頼みの綱である。"
 blkf.298.a:0 "ドナウ圏協力に応じる"
 blkf.298.b:0 "断る"
 ### ニュース
 blknews.200.t:0 "イタリア艦隊、ドゥラス沖に"
 blknews.200.d:0 "イタリア艦隊がアルバニアのドゥラス沖で示威行動を行った。ローマはアルバニアの連邦加盟を認めていないことを、改めて世界に示した。"
 blknews.200.a:0 "アドリア海に緊張"
 blknews.201.t:0 "ニヨン会議"
 blknews.201.d:0 "英仏の主導で、地中海の「海賊潜水艦」対策を協議するニヨン会議が開かれた。地中海諸国による共同哨戒が合意された。"
 blknews.201.a:0 "地中海の秩序"
 blknews.202.t:0 "ヴォイヴォディナで住民投票"
 blknews.202.d:0 "バルカン連邦とハンガリーの係争地バチュカで住民投票が行われた。双方が不正を主張しており、結果の承認は難航している。"
 blknews.202.a:0 "投票箱の戦い"
 blknews.203.t:0 "ドイツとバルカン連邦が国境を接す"
 blknews.203.d:0 "オーストリア併合により、ドイツとバルカン連邦はカラヴァンケ山脈で直接国境を接することになった。ベオグラードは静観の構えだが、スロヴェニアでは動員の噂が流れている。"
 blknews.203.a:0 "新たな国境線"
 blknews.204.t:0 "イタリア、アルバニアへの要求を宣言"
 blknews.204.d:0 "ムッソリーニはアルバニアを「イタリアの歴史的権利」と呼び、連邦に対する戦争準備を公然と命じた。"
 blknews.204.a:0 "アドリア海に戦雲"
 blknews.205.t:0 "バルカン連邦、チェコスロヴァキアを保証"
 blknews.205.d:0 "バルカン連邦はチェコスロヴァキアの独立を保証すると発表した。小協商の精神は、ミュンヘンの前夜にまだ生きていた。"
 blknews.205.a:0 "小協商は死なず"
