l_japanese:
 ### 政治枝
 blk_constituent_assembly:0 "連邦制憲議会"
 blk_constituent_assembly_desc:0 "ベオグラードに各構成国の代表を集め、連邦の恒久憲法を起草する。連邦がどのような国家になるのか、ここで決まる。"
 blk_crown_federation:0 "王冠の連邦"
 blk_crown_federation_desc:0 "三王評議会を連邦の中心に据え、君主制の権威と摂政の慎重さで半島を導く。急進を避け、均衡を守る道。"
 blk_council_of_three_crowns:0 "三王評議会の制度化"
 blk_council_of_three_crowns_desc:0 "摂政パヴレ、ボリス3世、ゾグ1世の合議体を憲法上の機関として明文化し、連邦元首の権限を確立する。"
 blk_serbian_bulgarian_compromise:0 "セルビア＝ブルガリア妥協"
 blk_serbian_bulgarian_compromise_desc:0 "連邦の二大民族が官職・軍の配分と言語の地位で妥協に達する。連邦の屋台骨はこの合意にかかっている。"
 blk_royal_army_oath:0 "連邦軍の忠誠宣誓"
 blk_royal_army_oath_desc:0 "全将兵に三王評議会と連邦憲法への忠誠宣誓を求める。軍はもはやセルビア軍でもブルガリア軍でもない。"
 blk_balkan_entente_leadership:0 "バルカン協商の盟主"
 blk_balkan_entente_leadership_desc:0 "1934年のバルカン協商を連邦主導の集団安全保障体制として再生させ、ギリシャ・ルーマニア・トルコを招く。"
 blk_federal_crown_act:0 "連邦王位法"
 blk_federal_crown_act_desc:0 "連邦王位の継承順位と各王家の地位を法律で定める。カラジョルジェヴィチ家の若き王ペータルが連邦の象徴となる日を準備する。"
 blk_armed_neutrality:0 "武装中立の宣言"
 blk_armed_neutrality_desc:0 "連邦はいかなる大国の陣営にも与しないことを宣言し、自らの力で半島を守る決意を示す。"
 blk_guardian_of_the_balkans:0 "バルカンの守護者"
 blk_guardian_of_the_balkans_desc:0 "連邦は半島の秩序の保証人として、諸民族と諸国から認められる存在となった。"
 blk_peoples_federation:0 "民衆の連邦"
 blk_peoples_federation_desc:0 "クロアチア農民党とブルガリア農民同盟を軸に、民衆の支持に立脚する民主的な連邦を目指す。"
 blk_croatian_sporazum:0 "クロアチア協定"
 blk_croatian_sporazum_desc:0 "マチェクのクロアチア農民党と協定を結び、クロアチアに広範な自治を認める。連邦最大の火種をここで消す。"
 blk_agrarian_alliance:0 "農民同盟"
 blk_agrarian_alliance_desc:0 "半島の人口の大半を占める農民の政党を連邦規模で結集し、議会の多数派を形成する。"
 blk_federal_elections:0 "連邦総選挙"
 blk_federal_elections_desc:0 "連邦初の自由選挙を実施する。評議会の時代は終わり、民衆の代表が連邦を率いる。"
 blk_language_and_schools:0 "言語・教育法"
 blk_language_and_schools_desc:0 "各民族の言語を公用語として対等に認め、連邦の学校制度を整備する。"
 blk_western_credit:0 "西側借款"
 blk_western_credit_desc:0 "ロンドンとパリから借款を受け、連邦の工業化を加速する。"
 blk_little_entente_bridge:0 "小協商との架橋"
 blk_little_entente_bridge_desc:0 "チェコスロヴァキアとルーマニアとの旧来の同盟関係を連邦の外交に引き継ぐ。"
 blk_join_allies:0 "連合国への加盟"
 blk_join_allies_desc:0 "民主主義諸国の陣営に正式に加わる。"
 blk_democratic_balkan_union:0 "民主バルカン同盟"
 blk_democratic_balkan_union_desc:0 "連邦を中心とする半島諸国の独自の同盟を結成する。"
 blk_federation_of_free_peoples:0 "自由諸民族の連邦"
 blk_federation_of_free_peoples_desc:0 "バルカンの諸民族が自らの意思で結んだ連邦は、ついに完成する。"
 blk_officers_federation:0 "将校団の連邦"
 blk_officers_federation_desc:0 "ズヴェノの将校団とセルビア軍の参謀たちが、政党政治を排して軍の規律で連邦を統一する道を選ぶ。"
 blk_zveno_ascendancy:0 "ズヴェノの台頭"
 blk_zveno_ascendancy_desc:0 "1934年クーデタの立役者たちが連邦政府の要職を占める。"
 blk_crackdown_on_parties:0 "政党解散令"
 blk_crackdown_on_parties_desc:0 "民族政党を「連邦の分断を煽るもの」として解散させる。"
 blk_military_council:0 "軍事評議会の樹立"
 blk_military_council_desc:0 "三王評議会に代わり、将校団による軍事評議会が連邦の実権を握る。"
 blk_fortress_balkans:0 "要塞バルカン"
 blk_fortress_balkans_desc:0 "山岳と沿岸に要塞線を築き、半島を難攻不落の要塞とする。"
 blk_national_industrial_mobilization:0 "国家総動員"
 blk_national_industrial_mobilization_desc:0 "連邦の全産業を軍需に動員する。"
 blk_axis_alignment:0 "枢軸への接近"
 blk_axis_alignment_desc:0 "ベルリンとの提携により、連邦の野望を実現する後ろ盾を得る。"
 blk_third_way:0 "第三の道"
 blk_third_way_desc:0 "いかなる大国にも頼らず、連邦は自らの力で半島の覇者となる。"
 blk_greater_balkan_federation:0 "大バルカン連邦"
 blk_greater_balkan_federation_desc:0 "半島のすべてをひとつの旗の下に。テッサロニキとドブロジャへの要求を公然と掲げる。"
 blk_march_on_salonika:0 "テッサロニキ進軍"
 blk_march_on_salonika_desc:0 "エーゲ海への出口を力で獲得する。"
 blk_dobruja_ultimatum:0 "ドブロジャ最後通牒"
 blk_dobruja_ultimatum_desc:0 "ブカレストに南ドブロジャの即時返還を要求する。拒否すれば戦争だ。"
 blk_balkan_hegemony:0 "バルカンの覇権"
 blk_balkan_hegemony_desc:0 "半島に連邦に対抗できる国家はもはや存在しない。"
 blk_red_federation:0 "赤い連邦"
 blk_red_federation_desc:0 "半島の共産党を結集し、民族を超えた労働者の連邦を目指す。"
 blk_workers_councils:0 "労働者評議会"
 blk_workers_councils_desc:0 "工場と鉱山に労働者評議会を組織する。"
 blk_dimitrov_returns:0 "ディミトロフの帰国"
 blk_dimitrov_returns_desc:0 "ライプツィヒ裁判の英雄、コミンテルン書記長ゲオルギ・ディミトロフがソフィアに帰還する。"
 blk_proclaim_socialist_federation:0 "社会主義連邦の宣言"
 blk_proclaim_socialist_federation_desc:0 "三王評議会を廃し、バルカン社会主義連邦共和国を宣言する。"
 blk_land_reform:0 "土地改革"
 blk_land_reform_desc:0 "大土地所有を解体し、農民に土地を分配する。"
 blk_partisan_army:0 "パルチザン軍の編成"
 blk_partisan_army_desc:0 "山岳遊撃戦を中核とする新しい人民軍を編成する。"
 blk_comintern_alignment:0 "コミンテルン路線"
 blk_comintern_alignment_desc:0 "モスクワの指導に従い、国際共産主義運動の一翼を担う。"
 blk_balkan_road_to_socialism:0 "バルカン独自の道"
 blk_balkan_road_to_socialism_desc:0 "労働者自主管理と非同盟。モスクワの型には嵌まらない、バルカン的社会主義を築く。"
 blk_balkan_socialist_federation:0 "バルカン社会主義連邦"
 blk_balkan_socialist_federation_desc:0 "半島のすべての労働者をひとつの社会主義連邦に結集する。"
 blk_export_revolution:0 "革命の輸出"
 blk_export_revolution_desc:0 "ギリシャとルーマニアの同志たちを支援する。"
 blk_liberate_the_balkans:0 "半島の解放"
 blk_liberate_the_balkans_desc:0 "反動政権から半島の労働者を解放する。"
 ### 連邦統合枝
 blk_internal_security:0 "連邦内務省の設立"
 blk_internal_security_desc:0 "各構成国の警察を統合し、連邦内務省を設立する。"
 blk_crush_imro:0 "IMROの掃討"
 blk_crush_imro_desc:0 "内部マケドニア革命組織を武力で壊滅させる。"
 blk_macedonian_autonomy:0 "マケドニア自治"
 blk_macedonian_autonomy_desc:0 "マケドニアを連邦の構成単位として認め、IMROの穏健派を取り込む。"
 blk_albanian_settlement:0 "アルバニア協定"
 blk_albanian_settlement_desc:0 "アルバニアの自治と連邦への統合を両立させる協定を結ぶ。"
 blk_federal_citizenship:0 "連邦市民権法"
 blk_federal_citizenship_desc:0 "出身民族を問わず、すべての住民に平等な連邦市民権を与える。"
 blk_one_federation_many_peoples:0 "多民族一連邦"
 blk_one_federation_many_peoples_desc:0 "連邦はついに名実ともに統一された。"
 ### 外交枝
 blk_balkan_diplomacy:0 "バルカン外交の基軸"
 blk_balkan_diplomacy_desc:0 "連邦外交の第一の目標は半島の安定である。"
 blk_approach_greece:0 "ギリシャへの接近"
 blk_approach_greece_desc:0 "アテネとの関係を改善し、南の隣人の不安を取り除く。"
 blk_approach_romania:0 "ルーマニアへの接近"
 blk_approach_romania_desc:0 "ブカレストとの関係を改善し、ドナウの隣人との対話を始める。"
 blk_approach_turkey:0 "トルコへの接近"
 blk_approach_turkey_desc:0 "アンカラとの関係を改善し、海峡の安全を共有する。"
 blk_salonika_free_port:0 "テッサロニキ自由港"
 blk_salonika_free_port_desc:0 "ギリシャとの協定で連邦のエーゲ海への出口を確保する。"
 blk_dobruja_settlement:0 "ドブロジャ協定"
 blk_dobruja_settlement_desc:0 "南ドブロジャの平和的な譲渡をルーマニアに提案する。"
 blk_straits_accord:0 "海峡協約"
 blk_straits_accord_desc:0 "トルコとの間で黒海と海峡の安全保障に関する協約を結ぶ。"
 blk_invite_greece:0 "ギリシャ連邦加盟交渉"
 blk_invite_greece_desc:0 "ギリシャに連邦構成国としての加盟を提案する。"
 blk_invite_romania:0 "ルーマニア連邦加盟交渉"
 blk_invite_romania_desc:0 "ルーマニアに連邦構成国としての加盟を提案する。"
 blk_black_sea_pact:0 "黒海協定"
 blk_black_sea_pact_desc:0 "トルコを連邦の陣営に招き、黒海の安全を共有する。"
 blk_all_balkans_united:0 "全バルカンの統合"
 blk_all_balkans_united_desc:0 "連邦に加盟した諸国を完全に統合するか、構成国としての地位を保つかを決める。"
 blk_adriatic_question:0 "アドリア海問題"
 blk_adriatic_question_desc:0 "イタリアとの関係をどうするか。連邦の西の国境は海であり、その海の対岸にはローマがいる。"
 blk_adriatic_detente:0 "アドリア海デタント"
 blk_adriatic_detente_desc:0 "イタリアに不可侵条約を提案し、西の脅威を取り除く。"
 blk_defend_the_adriatic:0 "アドリア海防衛"
 blk_defend_the_adriatic_desc:0 "イタリアとの対決を見据え、沿岸の防備を固める。"
 blk_zara_and_istria:0 "ザラとイストリアの回収"
 blk_zara_and_istria_desc:0 "ラパッロ条約で失われたアドリア海沿岸の南スラヴ人地域への要求を掲げる。"
 blk_adriatic_trade_pact:0 "アドリア海通商協定"
 blk_adriatic_trade_pact_desc:0 "イタリアとの通商を正常化し、経済的圧力を解除させる。"
 ### 産業枝
 blk_federal_development_plan:0 "連邦開発計画"
 blk_federal_development_plan_desc:0 "連邦規模の経済開発計画を立案する。"
 blk_sofia_belgrade_railway:0 "ソフィア＝ベオグラード幹線"
 blk_sofia_belgrade_railway_desc:0 "連邦の二大都市を結ぶ幹線鉄道を複線化し、スコピエへの支線を整備する。"
 blk_adriatic_ports:0 "アドリア港湾整備"
 blk_adriatic_ports_desc:0 "スプリトとドゥラスの港を拡張する。"
 blk_bor_and_trepca:0 "ボル・トレプチャ鉱山"
 blk_bor_and_trepca_desc:0 "セルビアの銅山とコソヴォの鉛・亜鉛鉱山、ボスニアの鉄鉱石を開発する。"
 blk_zenica_steelworks:0 "ゼニツァ製鉄所"
 blk_zenica_steelworks_desc:0 "ボスニアの鉄鉱石を用いる連邦最大の製鉄所を建設する。"
 blk_pernik_coal_and_power:0 "ペルニク石炭・電力"
 blk_pernik_coal_and_power_desc:0 "ブルガリア西部の炭田を開発し、ソフィアに火力発電所を建設する。"
 blk_kragujevac_arsenal:0 "クラグイェヴァツ兵器廠"
 blk_kragujevac_arsenal_desc:0 "旧セルビア王国軍の兵器廠を連邦軍の中央兵器廠として拡張する。"
 blk_federal_bank:0 "連邦銀行"
 blk_federal_bank_desc:0 "ディナールとレフを統合し、連邦銀行を設立する。"
 blk_albanian_oil:0 "アルバニア油田開発"
 blk_albanian_oil_desc:0 "クチョヴァの油田を開発し、イタリア資本に頼らない石油供給を確立する。"
 blk_industrial_federation:0 "産業連邦"
 blk_industrial_federation_desc:0 "連邦の工業化計画を本格化させる。"
 blk_military_industrial_complex:0 "連邦軍需複合体"
 blk_military_industrial_complex_desc:0 "連邦の軍需産業を統合し、兵器の国産化を進める。"
 blk_federal_research_institutes:0 "連邦研究機構"
 blk_federal_research_institutes_desc:0 "ベオグラード大学とソフィア大学を中心に連邦研究機構を設立する。"
 blk_electrification:0 "連邦電化計画"
 blk_electrification_desc:0 "水力発電と送電網で連邦全土を電化する。"
 ### 軍事枝
 blk_federal_army_act:0 "連邦軍法"
 blk_federal_army_act_desc:0 "旧三国の軍を統合し、連邦軍を創設する。"
 blk_unified_general_staff:0 "統合参謀本部"
 blk_unified_general_staff_desc:0 "ベオグラードとソフィアの参謀本部を統合する。"
 blk_mountain_corps:0 "山岳軍団"
 blk_mountain_corps_desc:0 "半島の地形を熟知した山岳部隊を連邦軍の精鋭として育成する。"
 blk_federal_air_force:0 "連邦空軍"
 blk_federal_air_force_desc:0 "旧三国の航空隊を統合し、連邦空軍を創設する。"
 blk_infantry_modernization:0 "歩兵近代化"
 blk_infantry_modernization_desc:0 "歩兵装備を更新する。"
 blk_artillery_program:0 "砲兵計画"
 blk_artillery_program_desc:0 "山岳戦に適した砲兵を整備する。"
 blk_guerrilla_tradition:0 "山岳戦の伝統"
 blk_guerrilla_tradition_desc:0 "ハイドゥクとチェタの伝統を正規軍の教義に取り込む。"
 blk_fighter_procurement:0 "戦闘機調達"
 blk_fighter_procurement_desc:0 "近代的な戦闘機を調達し、国産化を進める。"
 blk_adriatic_fleet:0 "アドリア艦隊"
 blk_adriatic_fleet_desc:0 "旧ユーゴスラヴィア海軍を中核に連邦海軍を整備する。"
 blk_motorization:0 "自動車化"
 blk_motorization_desc:0 "連邦軍の機動力を高める。"
 blk_fortify_frontiers:0 "国境要塞線"
 blk_fortify_frontiers_desc:0 "北部国境に要塞線を築く。"
 blk_bomber_wing:0 "爆撃航空団"
 blk_bomber_wing_desc:0 "爆撃機と近接航空支援機を整備する。"
 blk_submarine_flotilla:0 "潜水艦隊"
 blk_submarine_flotilla_desc:0 "アドリア海の防衛に潜水艦を活用する。"
 blk_armored_experiment:0 "装甲試験部隊"
 blk_armored_experiment_desc:0 "戦車の運用試験を始める。"
 blk_mass_mobilization:0 "国民動員"
 blk_mass_mobilization_desc:0 "連邦の人口を軍事動員する体制を整える。"
 blk_air_defence_network:0 "防空網"
 blk_air_defence_network_desc:0 "レーダーと高射砲で主要都市を守る。"
 blk_balkan_shield:0 "バルカンの盾"
 blk_balkan_shield_desc:0 "連邦軍は半島の盾として完成した。"
 ### ギリシャ：バルカン路線
 GRE_balkan_focus:0 "ギリシャ：バルカン路線"
 gre_blk_rapprochement:0 "連邦との協調"
 gre_blk_rapprochement_desc:0 "北の巨人と手を結ぶ。"
 gre_blk_salonika_agreement:0 "テッサロニキ港協定"
 gre_blk_salonika_agreement_desc:0 "連邦にテッサロニキの自由港使用を認め、見返りに投資を得る。"
 gre_blk_border_pact:0 "マケドニア国境協定"
 gre_blk_border_pact_desc:0 "北部国境の確定と相互不可侵を取り決める。"
 gre_blk_join_entente:0 "バルカン協商への加盟"
 gre_blk_join_entente_desc:0 "連邦の陣営に加わる。"
 gre_blk_federal_republic:0 "連邦構成国ギリシャ"
 gre_blk_federal_republic_desc:0 "ギリシャは連邦の構成国となる。"
 gre_blk_metaxas_line:0 "メタクサスの要塞"
 gre_blk_metaxas_line_desc:0 "北の巨人に備える。"
 gre_blk_british_guarantee:0 "英国の保証"
 gre_blk_british_guarantee_desc:0 "ロンドンに独立の保証を求める。"
 gre_blk_northern_fortifications:0 "北部要塞線"
 gre_blk_northern_fortifications_desc:0 "マケドニアとトラキアの国境を要塞化する。"
 gre_blk_northern_ambition:0 "北方への野心"
 gre_blk_northern_ambition_desc:0 "マケドニアと南アルバニアへの要求を掲げる。"
 gre_blk_war_for_macedonia:0 "マケドニア戦争"
 gre_blk_war_for_macedonia_desc:0 "北の巨人に挑む。"
 gre_blk_industry:0 "ギリシャ工業化"
 gre_blk_industry_desc:0 "アテネとピレウスに工場を建てる。"
 gre_blk_army:0 "陸軍近代化"
 gre_blk_army_desc:0 "ギリシャ陸軍を近代化する。"
 gre_blk_navy:0 "海軍整備"
 gre_blk_navy_desc:0 "エーゲ海の制海権を確保する。"
