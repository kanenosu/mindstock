l_japanese:
 ### ギリシャ：バルカン路線（追加方針）
 gre_blk_macedonian_minority:0 "マケドニア少数民族協定"
 gre_blk_macedonian_minority_desc:0 "北部ギリシャに残るスラヴ語系住民の地位をめぐり、連邦と協定を結ぶ。学校と教会の自由を認める代わりに、連邦はマケドニア問題でギリシャ領を要求しないことを約束する。"
 gre_blk_aegean_trade:0 "エーゲ海通商路"
 gre_blk_aegean_trade_desc:0 "連邦の鉱物と穀物はテッサロニキとピレウスを経てエーゲ海に出る。ギリシャの海運業にとって、北の巨人は最大の顧客となった。"
 gre_blk_independent_partner:0 "対等な同盟者"
 gre_blk_independent_partner_desc:0 "ギリシャは連邦に加盟せず、独立した同盟者として半島の秩序に参加する。ヘレネスは誰の構成国にもならない。"
 gre_blk_italian_understanding:0 "イタリアとの了解"
 gre_blk_italian_understanding_desc:0 "ローマもまた連邦を恐れている。ドデカネス問題を棚上げし、反連邦の一点でイタリアと手を結ぶ。危険な賭けだが、北の圧力に対抗する手段ではある。"
 gre_blk_anti_communist_pact:0 "反共協定"
 gre_blk_anti_communist_pact_desc:0 "バルカンの共産主義運動は国境を越えて連携している。ルーマニア、トルコと情報を共有し、連邦から流れ込む赤い宣伝に備える。"
 gre_blk_northern_epirus:0 "北エピルス要求"
 gre_blk_northern_epirus_desc:0 "南アルバニアのギリシャ系住民が暮らす土地を、ギリシャ人は北エピルスと呼ぶ。1914年の自治宣言以来の懸案を、連邦に突きつける。"
 gre_blk_greater_greece:0 "大ギリシャ"
 gre_blk_greater_greece_desc:0 "メガリ・イデアは1922年のスミルナで死んだはずだった。しかし北の国境の向こうに、再びギリシャ人の土地が広がっている。"
 gre_blk_restoration_of_george:0 "ゲオルギオス2世の王政"
 gre_blk_restoration_of_george_desc:0 "1935年の国民投票で復位したゲオルギオス2世は、分裂した国民を統合する象徴となることを求められている。王冠は、共和派と王党派の抗争の上に立つ。"
 gre_blk_fourth_of_august:0 "8月4日体制"
 gre_blk_fourth_of_august_desc:0 "議会は麻痺し、ゼネストが迫っている。メタクサス将軍は国王の承認のもとに議会を停止し、「第三のギリシャ文明」を掲げる体制を樹立する。"
 gre_blk_venizelist_reconciliation:0 "ヴェニゼロス派との和解"
 gre_blk_venizelist_reconciliation_desc:0 "1935年の反乱で追放されたヴェニゼロス派の将校と政治家に恩赦を与える。国民分裂の時代を終わらせるには、王党派が先に手を差し伸べねばならない。"
 gre_blk_eon_youth:0 "国民青年組織"
 gre_blk_eon_youth_desc:0 "EON（国民青年組織）に全国の青少年を組織し、規律と愛国心を教える。体制の基盤は次の世代にある。"
 gre_blk_suppress_kke:0 "共産党の弾圧"
 gre_blk_suppress_kke_desc:0 "ギリシャ共産党（KKE）を非合法化し、マニアダキスの治安警察に指導者の逮捕を命じる。北の連邦から流れ込む宣伝を断つ。"
 gre_blk_labour_settlement:0 "労働者との和解"
 gre_blk_labour_settlement_desc:0 "労働組合と対話し、八時間労働と社会保険を法制化する。ストライキを警察ではなく交渉で終わらせる。"
 gre_blk_refugee_integration:0 "小アジア難民の統合"
 gre_blk_refugee_integration_desc:0 "1923年の住民交換で流入した120万の難民は、今なお北部ギリシャの定住地で貧困に喘いでいる。彼らを国民として統合する。"
 gre_blk_constitutional_settlement:0 "憲法的和解"
 gre_blk_constitutional_settlement_desc:0 "王冠と国民、王党派と共和派、本土人と難民。すべてのギリシャ人が受け入れられる憲法秩序を確立する。"
 gre_blk_piraeus_port:0 "ピレウス港の拡張"
 gre_blk_piraeus_port_desc:0 "アテネの外港ピレウスを地中海有数の商港として整備する。"
 gre_blk_thessaloniki_industry:0 "テッサロニキ工業地帯"
 gre_blk_thessaloniki_industry_desc:0 "北部の中心都市テッサロニキに工場を集積させる。連邦との通商は、この町に富をもたらすだろう。"
 gre_blk_ptolemais_lignite:0 "褐炭と電力"
 gre_blk_ptolemais_lignite_desc:0 "西マケドニアの褐炭を掘り、火力発電所を建てる。ギリシャの工業化は電力から始まる。"
 gre_blk_bauxite:0 "ボーキサイト開発"
 gre_blk_bauxite_desc:0 "パルナッソス山地のボーキサイトは、アルミニウムの原料として列強が欲しがっている。"
 gre_blk_agricultural_reform:0 "農地改革"
 gre_blk_agricultural_reform_desc:0 "テッサリアの大土地所有を解体し、小作農に土地を分配する。"
 gre_blk_mountain_divisions:0 "エヴゾネス山岳師団"
 gre_blk_mountain_divisions_desc:0 "ピンドス山脈の守りは、フスタネラをまとった山岳兵に託される。"
 gre_blk_artillery:0 "砲兵近代化"
 gre_blk_artillery_desc:0 "山岳戦に適した軽砲と、北部国境の要塞砲を更新する。"
 gre_blk_defensive_doctrine:0 "防御教義"
 gre_blk_defensive_doctrine_desc:0 "北の国境は山と要塞で守る。ギリシャ陸軍の教義は、数で勝る敵を地形で止めることに集中する。"
 gre_blk_air_force:0 "王立空軍"
 gre_blk_air_force_desc:0 "タトイ基地に近代的な戦闘機隊を置き、首都の空を守る。"
 gre_blk_destroyer_flotilla:0 "駆逐艦隊の整備"
 gre_blk_destroyer_flotilla_desc:0 "イギリスから駆逐艦を購入し、エーゲ海の制海権を確保する。"
 gre_blk_averof_modernization:0 "アヴェロフの近代化"
 gre_blk_averof_modernization_desc:0 "バルカン戦争の英雄、装甲巡洋艦ゲオルギオス・アヴェロフを改装し、艦隊の旗艦として再生させる。"
 gre_blk_aegean_command:0 "エーゲ海艦隊司令部"
 gre_blk_aegean_command_desc:0 "群島の守りを一元化し、エーゲ海艦隊司令部を設置する。"
 ### ルーマニア：バルカン路線（追加方針）
 rom_blk_danube_commission:0 "ドナウ委員会"
 rom_blk_danube_commission_desc:0 "ドナウ河の航行を管理する国際委員会を、連邦とともに再編する。河は国境ではなく、通商の動脈である。"
 rom_blk_titulescu_diplomacy:0 "ティトゥレスク外交"
 rom_blk_titulescu_diplomacy_desc:0 "外相ティトゥレスクの集団安全保障路線を国是とする。パリ、プラハ、ベオグラード、そして必要ならモスクワとも対話する。"
 rom_blk_independent_partner:0 "対等な同盟者"
 rom_blk_independent_partner_desc:0 "ルーマニアは連邦に加盟せず、独立した同盟者として半島の秩序に参加する。"
 rom_blk_axis_orientation:0 "枢軸への傾斜"
 rom_blk_axis_orientation_desc:0 "フランスは遠く、ドイツは近い。石油を求めるベルリンと取引し、南の連邦に対抗する後ろ盾を得る。"
 rom_blk_bessarabia_vigilance:0 "ベッサラビア警戒"
 rom_blk_bessarabia_vigilance_desc:0 "モスクワは1918年のベッサラビア併合を認めていない。南の連邦に気を取られている間に、東の国境が無防備になってはならない。"
 rom_blk_border_vigilance:0 "南部戦線"
 rom_blk_border_vigilance_desc:0 "ドナウ南岸の連邦軍に備え、国境警備を軍の管轄下に置く。"
 rom_blk_greater_romania_preserved:0 "大ルーマニアの維持"
 rom_blk_greater_romania_preserved_desc:0 "1918年に得たすべての土地を、一寸たりとも手放さない。それがルーマニアの国是である。"
 rom_blk_carol_personal_rule:0 "カロル2世の親政"
 rom_blk_carol_personal_rule_desc:0 "1930年に帰国して王位についたカロル2世は、政党を操り、自らの手で統治することを望んでいる。"
 rom_blk_royal_dictatorship:0 "王党独裁"
 rom_blk_royal_dictatorship_desc:0 "議会政治は腐敗と鉄衛団の暴力で麻痺している。国王は新憲法を公布し、すべての政党を解散させる。"
 rom_blk_parliamentary_compromise:0 "議会との妥協"
 rom_blk_parliamentary_compromise_desc:0 "国民自由党と国民農民党に政権を委ね、国王は憲法の枠内にとどまる。"
 rom_blk_crush_iron_guard:0 "鉄衛団の弾圧"
 rom_blk_crush_iron_guard_desc:0 "コドレアヌの「大天使ミカエル軍団」を非合法化し、指導者を逮捕する。暴力には暴力で応える。"
 rom_blk_iron_guard_coalition:0 "鉄衛団との連立"
 rom_blk_iron_guard_coalition_desc:0 "鉄衛団を政権に取り込み、その熱狂を国王のために利用する。虎の背に乗る政治。"
 rom_blk_national_peasants:0 "国民農民党政権"
 rom_blk_national_peasants_desc:0 "マニウの国民農民党に政権を委ね、農村の近代化を進める。"
 rom_blk_front_of_national_rebirth:0 "国民再生戦線"
 rom_blk_front_of_national_rebirth_desc:0 "すべての政治勢力を国王のもとに統合する単一の国民組織を設立する。"
 rom_blk_minorities_statute:0 "少数民族法"
 rom_blk_minorities_statute_desc:0 "トランシルヴァニアのハンガリー人、ドブロジャのブルガリア人、ベッサラビアのロシア人。大ルーマニアは多民族国家であり、その事実を法で認める。"
 rom_blk_danube_shipping:0 "ドナウ水運"
 rom_blk_danube_shipping_desc:0 "ガラツィとブライラの河港を整備し、ドナウ水運を国家の動脈とする。"
 rom_blk_resita_steel:0 "レシツァ製鉄所"
 rom_blk_resita_steel_desc:0 "バナトのレシツァ製鉄所を拡張し、兵器の国産化を支える。"
 rom_blk_astra_romana:0 "アストラ・ロマーナ"
 rom_blk_astra_romana_desc:0 "プロイェシュティ最大の石油会社の精製能力を拡張する。ルーマニアの石油は、列強が最も欲しがる資源である。"
 rom_blk_transylvanian_industry:0 "トランシルヴァニア工業化"
 rom_blk_transylvanian_industry_desc:0 "クルージュとブラショフに工場を建て、トランシルヴァニアを工業の中心とする。"
 rom_blk_french_mission:0 "フランス軍事顧問団"
 rom_blk_french_mission_desc:0 "第一次世界大戦以来のフランス軍事顧問団を再び招き、参謀教育を近代化する。"
 rom_blk_mountain_hunters:0 "山岳猟兵"
 rom_blk_mountain_hunters_desc:0 "カルパティアの守り手、ヴァナトリ・デ・ムンテを拡充する。"
 rom_blk_carpathian_line:0 "カルパティア防衛線"
 rom_blk_carpathian_line_desc:0 "トランシルヴァニアの峠に要塞を築き、ハンガリーの失地回復に備える。"
 rom_blk_air_force:0 "王立空軍"
 rom_blk_air_force_desc:0 "IAR社の国産戦闘機を量産し、王立空軍を近代化する。"
 rom_blk_navy:0 "黒海艦隊"
 rom_blk_navy_desc:0 "コンスタンツァを母港とする黒海艦隊を整備する。"
 rom_blk_danube_flotilla:0 "ドナウ艦隊"
 rom_blk_danube_flotilla_desc:0 "河川モニター艦でドナウの国境を守る。"
