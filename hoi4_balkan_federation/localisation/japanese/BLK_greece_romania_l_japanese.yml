 ### ギリシャ イベント
 blkf.100.t:0 "8月4日"
 blkf.100.d:0 "1936年8月4日。翌日に予定されたゼネストを前に、メタクサス首相は国王ゲオルギオス2世に議会の停止と憲法の一部停止を進言した。国王は署名した。\n\nアテネの街頭には軍が展開し、共産党の事務所は閉鎖された。メタクサスは「第三のギリシャ文明」を宣言し、古代ギリシャとビザンツに続く新しい時代を約束している。北の連邦は、ギリシャの独裁をどう見るだろうか。"
 blkf.100.a:0 "第三のギリシャ文明を"
 blkf.100.b:0 "非常大権にとどめる"
 blkf.101.t:0 "マニアダキスの警察"
 blkf.101.d:0 "治安相マニアダキスの警察は、共産党の組織を徹底的に破壊した。指導者は逮捕され、エーゲ海の島々に流された。しかし警察は、さらに巧妙な手段を提案している。逮捕した党員に「悔悟声明」を書かせ、公表することで党内に相互不信を植え付けるのだ。"
 blkf.101.a:0 "悔悟声明制度を導入する"
 blkf.101.b:0 "島流しと収容所で十分だ"
 blkf.102.t:0 "ヴェニゼロス派将校の帰還"
 blkf.102.d:0 "1935年3月の反乱で追放された将校たちが、恩赦を求めて帰国している。彼らの中には優秀な指揮官が多く、軍の戦力を考えれば復職させる価値はある。しかし王党派の将校たちは、反乱者が同じ軍服を着ることを認めない。"
 blkf.102.a:0 "全員を復職させる"
 blkf.102.b:0 "恩赦は与えるが軍には戻さない"
 blkf.103.t:0 "テッサロニキの商人たち"
 blkf.103.d:0 "連邦の自由港協定が発効し、テッサロニキの港には連邦の穀物と鉱石を積んだ列車が到着し始めた。港の商人たちは歓迎しているが、港湾の一角に連邦の税関員が常駐することに、民族主義者は抗議している。"
 blkf.103.a:0 "商人たちの歓迎を受け入れる"
 blkf.103.b:0 "連邦の税関員は置かせない"
 blkf.104.t:0 "ローマからの使者"
 blkf.104.d:0 "イタリア大使が、連邦に対する共同の立場を打診してきた。ローマはアルバニアの喪失を許しておらず、ギリシャが北エピルスを要求するなら支援するという。しかしイタリアはドデカネス諸島を占領したままであり、ギリシャ人はそれを忘れていない。"
 blkf.104.a:0 "ドデカネスを棚上げし、反連邦で協調する"
 blkf.104.b:0 "ドデカネス返還を条件にする"
 blkf.105.t:0 "ギリシャの北エピルス要求"
 blkf.105.d:0 "アテネが南アルバニアのギリシャ系住民地域、いわゆる「北エピルス」の地位について正式な要求を提出してきた。自治の保障、ギリシャ語学校、そして将来の国境調整の協議。ティラナは激怒しているが、連邦政府はギリシャとの関係も考えねばならない。"
 blkf.105.a:0 "断固拒否する"
 blkf.105.b:0 "南アルバニアのギリシャ系住民に自治を認める"
 blkf.106.t:0 "連邦の拒否"
 blkf.106.d:0 "連邦は北エピルスに関する我々の要求を一蹴した。アテネの世論は沸騰している。"
 blkf.106.a:0 "要求は取り下げない"
 blkf.107.t:0 "難民定住地"
 blkf.107.d:0 "北部ギリシャの難民定住地は、13年経った今も貧困と失業に苦しんでいる。政府は定住地に工場を建てて雇用を生むか、難民を優先的に徴兵して軍の人員に充てるかを検討している。"
 blkf.107.a:0 "定住地に工場を建てる"
 blkf.107.b:0 "難民を軍に動員する"
 blkf.108.t:0 "連邦構成国ギリシャ"
 blkf.108.d:0 "ギリシャは連邦構成国となった。国王ゲオルギオス2世は三王評議会に第四の席を得て、アテネには連邦の旗が掲げられた。ヘレネスの歴史に、新しい章が始まる。"
 blkf.108.a:0 "半島はひとつに"
 blkf.109.t:0 "国境事件"
 blkf.109.d:0 "北部国境で、連邦軍の巡視隊とギリシャ国境警備隊が銃撃戦を交わした。双方に死傷者が出ている。連邦側は「ギリシャ側の越境」を主張し、我が方は「連邦軍の挑発」を主張している。"
 blkf.109.a:0 "抗議にとどめる"
 blkf.109.b:0 "国境部隊を増強する"
 blkf.110.t:0 "赤い宣伝"
 blkf.110.d:0 "連邦のラジオ放送とパンフレットが、北部ギリシャの労働者と難民の間に広がっている。「バルカンの労働者はひとつ」という連邦の宣伝は、貧しい定住地では説得力を持っている。"
 blkf.110.a:0 "検閲を強化する"
 blkf.110.b:0 "放置する"
 ### ルーマニア イベント
 blkf.150.t:0 "ティトゥレスクの去就"
 blkf.150.d:0 "外相ニコラエ・ティトゥレスクは、国際連盟と集団安全保障の信奉者であり、連邦との協調とソ連との対話を進めてきた。しかし国王カロル2世と右派は、彼の親西欧路線を嫌っている。留任させるか、更迭するか。"
 blkf.150.a:0 "留任させる"
 blkf.150.b:0 "更迭する"
 blkf.151.t:0 "鉄衛団の台頭"
 blkf.151.d:0 "コルネリウ・コドレアヌの「大天使ミカエル軍団」、通称鉄衛団が農村で急速に支持を広げている。緑のシャツを着た若者たちが村々を回り、道路を直し、教会を建て、そして反ユダヤ主義と反議会主義を説いている。"
 blkf.151.a:0 "警察に監視させる"
 blkf.151.b:0 "集会を禁止する"
 blkf.152.t:0 "国王の親政"
 blkf.152.d:0 "カロル2世は決断した。新憲法を公布し、すべての政党を解散させ、国王が直接統治する。議会は国王の諮問機関となり、閣僚は国王に対してのみ責任を負う。"
 blkf.152.a:0 "新憲法を公布する"
 blkf.152.b:0 "諮問会議にとどめる"
 blkf.153.t:0 "コドレアヌの運命"
 blkf.153.d:0 "鉄衛団の指導者コドレアヌが逮捕され、反逆罪で有罪となった。しかし彼は獄中でも支持者を集めている。国王の側近は、彼を生かしておくことの危険を説いている。"
 blkf.153.a:0 "「逃亡を図った」として射殺する"
 blkf.153.b:0 "終身刑にとどめる"
 blkf.154.t:0 "ドブロジャ協定"
 blkf.154.d:0 "南ドブロジャをめぐる連邦との交渉がまとまりつつある。連邦は多額の補償金と工業投資、そして恒久的な友好関係を提示している。あるいは、国際監視下の住民投票で決着をつける道もある。"
 blkf.154.a:0 "補償と引き換えに譲渡する"
 blkf.154.b:0 "住民投票を提案する"
 blkf.160.t:0 "ドブロジャ住民投票"
 blkf.160.d:0 "国際連盟の監視下で、南ドブロジャの住民投票が実施された。ブルガリア系住民とルーマニア系住民、トルコ系住民が、それぞれの未来に票を投じた。"
 blkf.160.a:0 "結果を受け入れる"
 blkf.155.t:0 "ドニエストルの向こう"
 blkf.155.d:0 "ソ連はベッサラビアの併合を認めておらず、国境のドニエストル川沿いに軍を集結させているという報告がある。南の連邦に備えるあまり、東の国境が手薄になってはならない。"
 blkf.155.a:0 "ドニエストルの防備を固める"
 blkf.155.b:0 "連邦に共同防衛を打診する"
 blkf.156.t:0 "ドナウ委員会"
 blkf.156.d:0 "連邦とともに再編されたドナウ委員会の本部をどこに置くか、また航行税をどう分配するかが議題になっている。"
 blkf.156.a:0 "ガラツィに本部を置く"
 blkf.156.b:0 "航行税で譲歩し、連邦の信頼を得る"
 blkf.157.t:0 "トランシルヴァニアのハンガリー人"
 blkf.157.d:0 "少数民族法の施行にあたり、トランシルヴァニアの150万のハンガリー人をどう扱うかが問われている。学校と教会の自由を本当に保障するのか、それとも文書上の保障にとどめるのか。"
 blkf.157.a:0 "学校と教会を保障する"
 blkf.157.b:0 "文書上の保障にとどめる"
 blkf.158.t:0 "ドナウ国境事件"
 blkf.158.d:0 "南ドブロジャの国境で、連邦軍の巡視隊とルーマニア国境警備隊が銃撃戦を交わした。双方に死傷者が出ている。"
 blkf.158.a:0 "抗議にとどめる"
 blkf.158.b:0 "国境部隊を増強する"
 blkf.159.t:0 "連邦構成国ルーマニア"
 blkf.159.d:0 "ルーマニアは連邦構成国となった。国王カロル2世は三王評議会に席を得て、ブカレストには連邦の旗が掲げられた。ドナウの両岸は、ひとつの国家となった。"
 blkf.159.a:0 "ドナウはひとつに"
 ### ニュース
 blknews.100.t:0 "ギリシャで独裁体制"
 blknews.100.d:0 "アテネからの報道によれば、メタクサス首相は国王の承認のもとに議会を停止し、独裁体制を樹立した。共産党は非合法化され、各地で逮捕が続いている。"
 blknews.100.a:0 "第三のギリシャ文明"
 blknews.102.t:0 "大ギリシャの宣言"
 blknews.102.d:0 "アテネは、北の国境を越えて獲得した土地をギリシャの不可分の領土と宣言した。メガリ・イデアは再び生きている。"
 blknews.102.a:0 "メガリ・イデア"
 blknews.110.t:0 "ルーマニアで王党独裁"
 blknews.110.d:0 "ブカレストからの報道によれば、国王カロル2世は新憲法を公布し、すべての政党を解散させた。国王は議会を諮問機関とし、直接統治を開始する。"
 blknews.110.a:0 "国王の親政"
 blknews.111.t:0 "ドブロジャ住民投票"
 blknews.111.d:0 "国際連盟の監視下で、南ドブロジャの帰属を問う住民投票が実施された。ルーマニアと連邦は、結果を尊重すると表明している。"
 blknews.111.a:0 "投票による国境"
