l_english:
 ### 連邦国内イベント
 blk.1.t:0 "連邦の黎明"
 blk.1.d:0 "1936年1月1日、ベオグラードの旧王宮で三王評議会の新年会議が開かれた。摂政パヴレ、ツァーリ・ボリス3世、ゾグ1世が並んで立つ光景は、1年前には誰も想像しなかったものだ。\n\nマルセイユの銃弾がアレクサンダル1世の命を奪い、ソフィアでは将校団が議会政治を終わらせた。危機は好機となり、ベオグラードとソフィアは積年の対立を乗り越えて連合条約に署名した。イタリアの締め付けに苦しむティラナがこれに続いた。\n\nしかし条約の署名は終わりではなく始まりにすぎない。連邦にはまだ統一された行政も軍も通貨もない。クロアチア人は自治を、マケドニア人は承認を、将校たちは秩序を、そして地下の共産主義者は革命を求めている。\n\n新しい国家が、半島の未来を問うている。"
 blk.1.a:0 "バルカンはバルカン人のものだ。"
 blk.2.t:0 "制憲議会の開会"
 blk.2.d:0 "連邦制憲議会がベオグラードで開会した。各構成国から送られた代表たちは、連邦の恒久憲法を起草する任務を負っている。しかし議場は最初から対立に満ちている。セルビアの中央集権派は強力な連邦政府を求め、クロアチアとアルバニアの代表は広範な自治を主張し、将校団は「政治家の議論」に露骨な苛立ちを見せている。"
 blk.2.a:0 "強力な連邦政府を"
 blk.2.b:0 "構成国の自治を尊重する"
 blk.2.c:0 "秩序は軍が守る"
 blk.3.t:0 "クロアチア農民党の要求"
 blk.3.d:0 "ヴラトコ・マチェク率いるクロアチア農民党が、連邦政府に対して正式な要求書を提出した。クロアチアを独自の議会と財政権を持つ自治単位として認めること、連邦軍内にクロアチア人部隊を編成すること、ザグレブ大学の自治を保障することなどが含まれている。\n\nセルビアの中央集権派はこれを「連邦解体への第一歩」と非難しているが、クロアチアの農村ではマチェクの支持は絶対的だ。"
 blk.3.a:0 "譲歩し、交渉の席につく"
 blk.3.b:0 "要求を拒否する"
 blk.4.t:0 "ゾグ王の不満"
 blk.4.d:0 "ティラナからの報告によれば、ゾグ1世は連邦加盟の条件が守られていないと公然と不満を述べている。アルバニアへの投資は約束より少なく、連邦の官職にアルバニア人はほとんど登用されず、ベオグラードの役人はティラナを「田舎の州都」のように扱っているという。\n\nイタリアの外交官がゾグの周囲で活発に動いているという情報もある。"
 blk.4.a:0 "アルバニアの自治を拡大し、投資を約束する"
 blk.4.b:0 "連邦の統一が優先だ"
 blk.5.t:0 "ボリス3世と将校団"
 blk.5.d:0 "ソフィアで、ツァーリ・ボリス3世とズヴェノの将校団の対立が表面化した。1934年のクーデタで実権を握った将校たちは、国王を「飾り物」として扱い続けてきた。しかし連邦の成立によって三王評議会の一員となったボリスは、再び政治的影響力を取り戻そうとしている。\n\nダミャン・ヴェルチェフ大佐は「軍は連邦に忠誠を誓ったのであって、王冠にではない」と語ったと伝えられる。"
 blk.5.a:0 "国王を支持する"
 blk.5.b:0 "将校団を支持する"
 blk.5.c:0 "双方から距離を置き、議会を支持する"
 blk.6.t:0 "マルセイユの記憶"
 blk.6.d:0 "アレクサンダル1世暗殺から2年。ベオグラードで追悼式典が行われた。マケドニア人の暗殺者ヴラド・チェルノゼムスキと、彼を送り込んだウスタシャの背後にイタリアとハンガリーの庇護があったことは、連邦の誰もが知っている。\n\n式典では、連邦の成立こそが暗殺者たちへの最大の返答であると語られた。"
 blk.6.a:0 "連邦の礎として追悼する"
 blk.6.b:0 "ウスタシャとその庇護者を名指しで非難する"
 blk.7.t:0 "IMROの爆弾"
 blk.7.d:0 "スコピエの中央駅で爆弾が爆発し、数十人が死傷した。内部マケドニア革命組織の犯行声明が出されている。IMROは連邦をマケドニア人に対する「セルビア＝ブルガリアの共同占領」と呼び、マケドニアの独立を要求している。"
 blk.7.a:0 "掃討作戦を命じる"
 blk.7.b:0 "マケドニア人の穏健派指導者と交渉する"
 blk.8.t:0 "ストヤディノヴィチの経済構想"
 blk.8.d:0 "連邦財務相ミラン・ストヤディノヴィチが、連邦経済の発展計画を提示した。彼の構想の核心は外国資本の導入である。問題は、その資本をどこから得るかだ。ドイツは連邦の鉱物資源を欲しており、気前のいい条件を提示している。一方、フランスとイギリスの銀行は政治的な条件を付けるが、連邦の独立性は保たれる。"
 blk.8.a:0 "ドイツとの通商を拡大する"
 blk.8.b:0 "西側資本を導入する"
 blk.9.t:0 "クロアチア独立の危機"
 blk.9.d:0 "連邦政府の権威の低下に乗じて、ザグレブで大規模なデモが発生した。群衆は「クロアチア独立」を叫び、一部では連邦の旗が引き裂かれている。クロアチア農民党の穏健派さえも、もはや群衆を抑えられない。亡命中のウスタシャがこの機会を逃すはずはない。"
 blk.9.a:0 "戒厳令で鎮圧する"
 blk.9.b:0 "クロアチア自治州を認める"
 blk.20.t:0 "ディミトロフの帰国"
 blk.20.d:0 "ゲオルギ・ディミトロフがソフィアに帰還した。国会議事堂放火事件の裁判でゲーリングを論破した男、コミンテルンの書記長は、駅頭で数万の群衆に迎えられた。「バルカンの労働者はひとつだ」と彼は叫んだ。連邦政府は彼の帰国を黙認せざるを得なかった。"
 blk.20.a:0 "バルカンの労働者はひとつだ"
 blk.21.t:0 "社会主義連邦の指導者"
 blk.21.d:0 "三王評議会は解散し、バルカン社会主義連邦共和国が宣言された。だが新しい連邦を誰が率いるのか。ザグレブの金属労働者出身で党の組織を一手に握るヨシップ・ブロズ・ティトーか、それともコミンテルンの権威と国際的名声を持つゲオルギ・ディミトロフか。"
 blk.21.a:0 "ティトー"
 blk.21.b:0 "ディミトロフ"
 blk.22.t:0 "軍事評議会の性格"
 blk.22.d:0 "将校団が連邦の実権を握った。しかし将校団は一枚岩ではない。ブルガリアのズヴェノを率いるダミャン・ヴェルチェフは、民族を超えた「バルカンの軍人国家」を夢見ている。一方、セルビア王国軍の参謀総長だったミラン・ネディッチは、連邦をセルビア軍の規律の下に置こうとしている。"
 blk.22.a:0 "ヴェルチェフとズヴェノ"
 blk.22.b:0 "ネディッチとセルビア将校団"
 blk.23.t:0 "連邦総選挙の結果"
 blk.23.d:0 "連邦初の自由選挙が行われた。農民・民主ブロックが圧勝し、ヴラトコ・マチェクが連邦首相に選ばれた。三王評議会は象徴的な地位に退き、連邦は名実ともに民衆の国家となった。"
 blk.23.a:0 "民衆が選んだ"
 blk.24.t:0 "ペータル2世の即位"
 blk.24.d:0 "ペータル・カラジョルジェヴィチが成年に達した。連邦王位法に従い、彼は連邦王として即位し、三王評議会の議長となる。若き王の戴冠式は、連邦の統一の象徴として半島全土で祝われた。"
 blk.24.a:0 "連邦王万歳"
 blk.25.t:0 "イタリアの要求：アルバニア港湾"
 blk.25.d:0 "ローマからの覚書が届いた。イタリアはドゥラスとヴロラの港湾の使用権、サザン島の租借、そしてアルバニアにおけるイタリア資本の特権的地位を要求している。覚書の文面は丁重だが、その背後にアドリア海のイタリア艦隊があることは明らかだ。"
 blk.25.a:0 "受け入れる"
 blk.25.b:0 "拒否する"
 blk.26.t:0 "ハンガリーのヴォイヴォディナ要求"
 blk.26.d:0 "ブダペストが、バチュカとバナトの「ハンガリー人地域」の返還を要求してきた。トリアノン条約の見直しは、ハンガリーの悲願である。"
 blk.26.a:0 "断固拒否する"
 blk.26.b:0 "住民投票を提案する"
 blk.30.t:0 "大バルカン連邦の宣言"
 blk.30.d:0 "ベオグラードからブカレストへ、アテネからソフィアへ。半島のすべての主要地域が連邦の旗の下に集まった。バルカン戦争以来の夢であった半島の統一は、ついに現実となった。"
 blk.30.a:0 "半島はひとつになった"
 blk.31.t:0 "全バルカンの統合"
 blk.31.d:0 "連邦に加盟した諸国をどのように扱うべきか。完全に統合して単一の連邦とするか、それとも構成国としての独自の地位を認め続けるか。"
 blk.31.a:0 "完全に統合する"
 blk.31.b:0 "構成国としての地位を維持する"
 blk.32.t:0 "新たな構成共和国"
 blk.32.d:0 "併合した隣国の領土をどう扱うか。連邦の新たな構成共和国として中核化するか、占領統治を続けるか。"
 blk.32.a:0 "連邦の構成共和国とする"
 blk.32.b:0 "占領統治を続ける"
 blk.90.t:0 "[From.GetName]の返答"
 blk.90.d:0 "[From.GetName]は我々の提案を受け入れた。"
 blk.90.a:0 "よし"
 blk.91.t:0 "[From.GetName]の返答"
 blk.91.d:0 "[From.GetName]は我々の提案を拒否した。"
 blk.91.a:0 "残念だ"
 blk.92.t:0 "ドブロジャ協定の成立"
 blk.92.d:0 "ルーマニアは補償と引き換えに南ドブロジャの譲渡に同意した。1913年以来の懸案が、戦争なしに解決された。"
 blk.92.a:0 "ドブロジャは帰ってきた"
 ### 他国イベント
 blkf.1.t:0 "北の巨人"
 blkf.1.d:0 "バルカン連邦の成立により、ギリシャの北の国境のすべてがひとつの大国に接することになった。連邦は半島最大の人口と軍を持ち、テッサロニキへの関心を隠していない。\n\nメタクサス将軍は決断を迫られている。連邦と協調して半島の安定を図るか、北の国境を固めて警戒するか、それとも外交のすべてを連邦との関係に賭けるか。"
 blkf.1.a:0 "協調路線をとる"
 blkf.1.b:0 "北の国境を固める"
 blkf.1.c:0 "バルカン路線に賭ける（専用の国家方針に切り替え）"
 blkf.2.t:0 "南の連邦"
 blkf.2.d:0 "バルカン連邦の成立は、ルーマニアに難しい問題を突きつけた。小協商の盟友だったユーゴスラヴィアは、今や南ドブロジャを要求するブルガリアと同じ国家の一部である。連邦との関係をどうするか。"
 blkf.2.a:0 "小協商の精神で協調する"
 blkf.2.b:0 "ドブロジャの防備を固める"
 blkf.2.c:0 "バルカン路線に賭ける（専用の国家方針に切り替え）"
 blkf.3.t:0 "南方の脅威"
 blkf.3.d:0 "ハンガリーの南に、以前のユーゴスラヴィアより遥かに大きな連邦が出現した。トリアノンの失地回復を目指すブダペストにとって、これは悪い知らせである。"
 blkf.3.a:0 "南部国境の防備を固める"
 blkf.3.b:0 "静観する"
 blkf.4.t:0 "アドリア海の新たな隣人"
 blkf.4.d:0 "アドリア海の対岸に、人口2000万を超える連邦が誕生した。アルバニアはイタリアの勢力圏から離脱し、「わが海」の東岸はもはやローマの思い通りにならない。ムッソリーニはこれをどう受け止めるか。"
 blkf.4.a:0 "連邦を敵視し、アルバニア沿岸への要求を掲げる"
 blkf.4.b:0 "通商と投資で懐柔する"
 blkf.5.t:0 "バルカンの資源"
 blkf.5.d:0 "バルカン連邦はクロム、ボーキサイト、銅、鉛、そして石油を持っている。ドイツの再軍備にとって、これらの資源は不可欠だ。連邦との通商関係をどう築くか。"
 blkf.5.a:0 "通商使節団を派遣する"
 blkf.5.b:0 "連邦を潜在的な敵と見なす"
 blkf.6.t:0 "バルカンの同志たち"
 blkf.6.d:0 "バルカン連邦には半島で最も組織された共産党がある。ディミトロフはモスクワにおり、ティトーは地下で党組織を築いている。連邦の赤化は、ソ連の南西国境を安全にするだろう。"
 blkf.6.a:0 "コミンテルンを通じて支援する"
 blkf.6.b:0 "静観する"
 blkf.7.t:0 "バルカンの安定装置"
 blkf.7.d:0 "外務省の分析によれば、バルカン連邦は地中海東部の安定装置になりうる。連邦が友好的である限り、イタリアの東進は抑えられ、ドイツの南下も阻まれる。問題は、連邦が友好的であり続けるかどうかだ。"
 blkf.7.a:0 "連邦との関係を深める"
 blkf.7.b:0 "距離を置く"
 blkf.8.t:0 "東方同盟網の再編"
 blkf.8.d:0 "フランスの東方同盟網は再編を迫られている。小協商の盟友ユーゴスラヴィアは、今やより大きな連邦の一部だ。連邦をフランスの同盟網に組み込めば、ドイツとイタリアを東から牽制できる。"
 blkf.8.a:0 "連邦を同盟網に組み込む"
 blkf.8.b:0 "小協商を優先する"
 blkf.9.t:0 "西の連邦"
 blkf.9.d:0 "トラキア国境の向こうに、新たな連邦が生まれた。1934年のバルカン協商の精神を引き継ぐなら協調できるが、連邦がブルガリアの旧来の要求を引き継ぐなら警戒が必要だ。"
 blkf.9.a:0 "バルカン協商の精神で協調する"
 blkf.9.b:0 "トラキア国境を警戒する"
 blkf.10.t:0 "連邦からの接近"
 blkf.10.d:0 "バルカン連邦の外交使節が、関係改善を提案してきた。"
 blkf.10.a:0 "歓迎する"
 blkf.10.b:0 "距離を置く"
 blkf.11.t:0 "ドブロジャ協定の提案"
 blkf.11.d:0 "バルカン連邦が南ドブロジャの譲渡を提案してきた。見返りは多額の補償金と、工業投資、そして連邦との友好関係である。1913年以来のこの係争地を、戦争なしに手放すべきか。"
 blkf.11.a:0 "補償と引き換えに譲渡する"
 blkf.11.b:0 "拒否する"
 blkf.12.t:0 "ドブロジャ最後通牒"
 blkf.12.d:0 "バルカン連邦が南ドブロジャの即時返還を要求してきた。回答期限は7日間。期限内に応じなければ、連邦は「必要なあらゆる手段」をとると通告している。"
 blkf.12.a:0 "屈服して譲渡する"
 blkf.12.b:0 "拒否する。戦争も辞さない"
 blkf.13.t:0 "連邦の陣営への招請"
 blkf.13.d:0 "バルカン連邦が我々を陣営に招いている。連邦は半島最大の軍事力を持つが、その陣営に加わることは、連邦の敵を我々の敵にすることでもある。"
 blkf.13.a:0 "加盟する"
 blkf.13.b:0 "辞退する"
 blkf.14.t:0 "連邦への加盟提案"
 blkf.14.d:0 "バルカン連邦が、我が国に連邦構成国としての加盟を提案してきた。外交と軍事は連邦が担い、内政の自治は保障されるという。半島の統一という夢と、独立の喪失という現実。"
 blkf.14.a:0 "連邦構成国として加盟する"
 blkf.14.b:0 "独立を守る"
 blkf.15.t:0 "アドリア海デタント"
 blkf.15.d:0 "バルカン連邦が不可侵条約と通商協定を提案してきた。アルバニアへの野心を一時棚上げすれば、地中海の他の方面に力を集中できる。"
 blkf.15.a:0 "不可侵条約を結ぶ"
 blkf.15.b:0 "拒否する"
 blkf.16.t:0 "連邦の枢軸接近"
 blkf.16.d:0 "バルカン連邦の軍事評議会が、ドイツとの提携を提案してきた。連邦の資源と軍はドイツにとって貴重だが、連邦の野望はドイツのバルカン政策と衝突する可能性もある。"
 blkf.16.a:0 "陣営に迎え入れる"
 blkf.16.b:0 "通商関係にとどめる"
 blkf.17.t:0 "バルカンからの同志"
 blkf.17.d:0 "バルカン社会主義連邦が、コミンテルンの陣営への加盟を申請してきた。"
 blkf.17.a:0 "迎え入れる"
 blkf.17.b:0 "時期尚早とする"
 blkf.18.t:0 "連邦の連合国加盟申請"
 blkf.18.d:0 "バルカン民主連邦が、連合国への加盟を申請してきた。連邦の加盟は地中海の戦略状況を一変させるが、同時に新たな義務も生じる。"
 blkf.18.a:0 "受け入れる"
 blkf.18.b:0 "独立の保証にとどめる"
 blkf.19.t:0 "革命の輸出"
 blkf.19.d:0 "バルカン連邦が国内の共産党を公然と支援している。工場と大学で連邦の宣伝が広がり、ストライキが頻発している。"
 blkf.19.a:0 "共産党を弾圧する"
 blkf.19.b:0 "容認する"
 blkf.21.t:0 "連邦の屈服"
 blkf.21.d:0 "バルカン連邦はアルバニア港湾に関する我々の要求を受け入れた。"
 blkf.21.a:0 "わが海は我々のものだ"
 blkf.22.t:0 "連邦の拒否"
 blkf.22.d:0 "バルカン連邦はアルバニア港湾に関する我々の要求を拒否した。"
 blkf.22.a:0 "戦争の口実とする"
 blkf.22.b:0 "引き下がる"
 blkf.24.t:0 "連邦の拒否"
 blkf.24.d:0 "バルカン連邦はヴォイヴォディナの返還を断固として拒否した。"
 blkf.24.a:0 "いずれ力で取り戻す"
 blkf.25.t:0 "住民投票の提案"
 blkf.25.d:0 "バルカン連邦はヴォイヴォディナでの住民投票を提案してきた。予想外の譲歩である。"
 blkf.25.a:0 "受け入れる"
 ### ニュース
 blknews.2.t:0 "バルカン連邦に軍事評議会"
 blknews.2.d:0 "ベオグラードからの報道によれば、バルカン連邦では将校団が三王評議会を解散させ、軍事評議会が政権を掌握した。政党は解散を命じられ、各地で戒厳令が敷かれている。"
 blknews.2.a:0 "将校たちの国家"
 blknews.3.t:0 "バルカン社会主義連邦の宣言"
 blknews.3.d:0 "バルカン連邦は社会主義連邦共和国への移行を宣言した。三王評議会は廃止され、赤い旗がベオグラードとソフィアに翻っている。"
 blknews.3.a:0 "半島が赤く染まる"
 blknews.4.t:0 "バルカン連邦で総選挙"
 blknews.4.d:0 "バルカン連邦で初の自由選挙が行われ、農民・民主ブロックが勝利した。三王評議会は象徴的な地位に退き、ヴラトコ・マチェクが連邦首相に就任する。"
 blknews.4.a:0 "民衆の連邦"
 blknews.5.t:0 "大バルカン連邦の宣言"
 blknews.5.d:0 "ベオグラードで大バルカン連邦の成立が宣言された。半島の主要地域はすべてひとつの旗の下に統一された。"
 blknews.5.a:0 "半島はひとつに"
 blknews.6.t:0 "バルカン連邦への宣戦"
 blknews.6.d:0 "[From.GetName]がバルカン連邦に宣戦布告した。半島は再び戦火に包まれる。"
 blknews.6.a:0 "半島に戦火"
 blknews.7.t:0 "大バルカンの野望"
 blknews.7.d:0 "バルカン連邦の軍事評議会は、テッサロニキと南ドブロジャへの要求を公然と掲げた。半島の近隣諸国は警戒を強めている。"
 blknews.7.a:0 "不穏な宣言"
 blknews.8.t:0 "バルカン社会主義連邦の宣言"
 blknews.8.d:0 "バルカン社会主義連邦は、半島のすべての労働者をひとつの連邦に結集すると宣言した。ギリシャとルーマニアの政府はこれを内政干渉だと非難している。"
 blknews.8.a:0 "革命は国境を知らない"
 blknews.9.t:0 "バルカン連邦に新たな構成国"
 blknews.9.d:0 "[From.GetName]がバルカン連邦への加盟を決定した。半島の統一は、戦争ではなく条約によって進んでいる。"
 blknews.9.a:0 "条約による統一"
