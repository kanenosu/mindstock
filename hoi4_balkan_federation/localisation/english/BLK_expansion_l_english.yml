 ### 連邦評議会（決定）
 BLK_federal_council:0 "連邦評議会"
 blk_council_status:0 "連邦評議会の現況"
 blk_council_status_desc:0 "各民族の連邦への満足度と、連邦の統合度。\n\n§Yセルビア人§!：[?blk_sat_serb|0]\n§Yブルガリア人§!：[?blk_sat_bulg|0]\n§Yクロアチア人・スロヴェニア人§!：[?blk_sat_croat|0]\n§Yマケドニア人§!：[?blk_sat_maced|0]\n§Yアルバニア人§!：[?blk_sat_alb|0]\n\n§G統合度§!：[?blk_integration|0]\n\n満足度は毎月、政策と国民精神に応じて変動する。いずれかが20を下回ると危機が起きる。平均が高ければ安定度と政治力が増し、統合度が高ければ戦争支持が増す。"
 blk_council_status_cost:0 "現況"
 blk_council_serb_officials:0 "セルビア人官僚の登用"
 blk_council_serb_officials_desc:0 "連邦官庁の要職にセルビア人を優先的に登用する。セルビア人+10、クロアチア人-4、ブルガリア人-4。"
 blk_council_serb_veterans:0 "退役軍人年金"
 blk_council_serb_veterans_desc:0 "バルカン戦争と大戦の退役軍人に連邦年金を支給する。セルビア人+6、戦争支持+2%。"
 blk_council_bulg_assembly_sofia:0 "連邦議会のソフィア開会"
 blk_council_bulg_assembly_sofia_desc:0 "連邦議会の会期をソフィアで開く。ブルガリア人+10、セルビア人-4。"
 blk_council_bulg_exarchate:0 "総主教庁の地位保障"
 blk_council_bulg_exarchate_desc:0 "ブルガリア正教会の独立した地位を連邦法で保障する。ブルガリア人+6、安定度+2%。"
 blk_council_croat_banovina:0 "ザグレブへの財政権移譲"
 blk_council_croat_banovina_desc:0 "クロアチア構成邦に独自の徴税権を認める。クロアチア人+10、セルビア人-5。"
 blk_council_croat_university:0 "ザグレブ・リュブリャナ大学への補助"
 blk_council_croat_university_desc:0 "両大学に連邦補助金を支給する。クロアチア人+6。"
 blk_council_maced_language:0 "マケドニア語の公用語化"
 blk_council_maced_language_desc:0 "マケドニア語をヴァルダル構成邦の公用語とする。マケドニア人+10、セルビア人-3、ブルガリア人-3。"
 blk_council_maced_amnesty:0 "IMRO穏健派への恩赦"
 blk_council_maced_amnesty_desc:0 "武装を放棄したIMRO構成員に恩赦を与える。マケドニア人+8、安定度-2%。"
 blk_council_alb_investment:0 "アルバニア開発基金"
 blk_council_alb_investment_desc:0 "アルバニア構成邦への道路・港湾投資。アルバニア人+10。"
 blk_council_alb_gendarmerie:0 "アルバニア憲兵隊の自治"
 blk_council_alb_gendarmerie_desc:0 "アルバニア憲兵隊をティラナの指揮下に置く。アルバニア人+6、セルビア人-2。"
 blk_council_federal_festival:0 "連邦記念祭"
 blk_council_federal_festival_desc:0 "1月1日の連邦記念日を全土で祝う。全民族+3、安定度+1%。"
 blk_council_integration_drive:0 "連邦統合推進運動"
 blk_council_integration_drive_desc:0 "行政・教育・通貨の統合を推進する全国運動。統合度+8。平均満足度40以上が必要。"
 ### 国民精神（拡張）
 BLK_chair_pavle:0 "議長：パヴレ摂政"
 BLK_chair_pavle_desc:0 "今年の三王評議会はベオグラードの摂政パヴレが主宰する。慎重で親英的な摂政の下、連邦の政治は安定するが活気に欠ける。"
 BLK_chair_boris:0 "議長：ボリス3世"
 BLK_chair_boris_desc:0 "今年の三王評議会はソフィアのツァーリ・ボリス3世が主宰する。軍に人気のある国王の下、連邦軍の士気は高い。"
 BLK_chair_zog:0 "議長：ゾグ1世"
 BLK_chair_zog_desc:0 "今年の三王評議会はティラナのゾグ1世が主宰する。商才に長けた王の下、通商は活発になるが、ベオグラードの官僚は彼を軽んじている。"
 BLK_regency_reform:0 "摂政評議会改革"
 BLK_regency_reform_desc:0 "摂政評議会の権限が明文化され、連邦政府との関係が整理された。"
 BLK_entente_general_staff:0 "協商合同参謀部"
 BLK_entente_general_staff_desc:0 "バルカン協商加盟国の参謀部が合同で作戦計画を立てる。"
 BLK_entente_member:0 "バルカン協商加盟国"
 BLK_entente_member_desc:0 "連邦との合同参謀部により防衛計画が共有されている。"
 BLK_labour_code:0 "連邦労働法"
 BLK_labour_code_desc:0 "8時間労働と団体交渉権が連邦全土で保障された。"
 BLK_womens_suffrage:0 "女性参政権"
 BLK_womens_suffrage_desc:0 "連邦は女性に参政権を認めた最初のバルカン国家となった。"
 BLK_cooperatives:0 "協同組合運動"
 BLK_cooperatives_desc:0 "農村の協同組合が流通と信用を担い、農民の生活を安定させている。"
 BLK_national_youth:0 "国民青年団"
 BLK_national_youth_desc:0 "全民族の青年を連邦の規律の下に組織する。"
 BLK_labour_service:0 "国民労働奉仕"
 BLK_labour_service_desc:0 "青年に半年間の労働奉仕を課し、道路と鉄道の建設に投入する。"
 BLK_corporatism:0 "協調組合経済"
 BLK_corporatism_desc:0 "労使を産業別組合に組織し、ストライキを禁じた。"
 BLK_serbian_officer_corps:0 "セルビア将校団の主導"
 BLK_serbian_officer_corps_desc:0 "ベオグラード参謀本部が連邦軍を掌握した。"
 BLK_zveno_officer_corps:0 "ズヴェノ将校団の主導"
 BLK_zveno_officer_corps_desc:0 "ソフィア参謀本部が連邦軍を掌握した。"
 BLK_balkan_legion:0 "バルカン軍団"
 BLK_balkan_legion_desc:0 "全民族から志願兵を集めた精鋭軍団。"
 BLK_balkan_imperium:0 "バルカン帝国"
 BLK_balkan_imperium_desc:0 "半島の覇権国家としての連邦。"
 BLK_spanish_veterans:0 "スペイン帰りの義勇兵"
 BLK_spanish_veterans_desc:0 "国際旅団で戦った義勇兵が連邦軍に経験をもたらした。"
 BLK_five_year_plan:0 "五カ年計画"
 BLK_five_year_plan_desc:0 "重工業優先の計画経済。"
 BLK_party_discipline:0 "党の規律"
 BLK_party_discipline_desc:0 "粛清により党は一枚岩となったが、知識人は口をつぐんだ。"
 BLK_collectivized_agriculture:0 "農業集団化"
 BLK_collectivized_agriculture_desc:0 "農地は集団農場に再編された。"
 BLK_cooperative_farms:0 "協同農場"
 BLK_cooperative_farms_desc:0 "強制なき協同化。農民は自らの土地を持ちつつ共同で働く。"
 BLK_socialist_balkans_complete:0 "社会主義バルカン"
 BLK_socialist_balkans_complete_desc:0 "半島全体がひとつの社会主義連邦となった。"
 BLK_federal_gendarmerie:0 "連邦憲兵隊"
 BLK_federal_gendarmerie_desc:0 "民族混成の連邦憲兵隊が治安を担う。"
 BLK_federal_university:0 "連邦大学"
 BLK_federal_university_desc:0 "ベオグラード・ソフィア・ザグレブの大学が連邦大学として連携する。"
 BLK_french_mission:0 "フランス軍事顧問団"
 BLK_french_mission_desc:0 "フランスの軍事顧問団が連邦軍の教育を担っている。"
 BLK_german_trade:0 "独通商条約"
 BLK_german_trade_desc:0 "ドイツとの清算協定により、鉱物と引き換えに機械が流入する。"
 BLK_danube_shipping:0 "ドナウ水運"
 BLK_danube_shipping_desc:0 "ドナウ川の水運が連邦の輸送網を支える。"
 BLK_women_in_industry:0 "女性労働者"
 BLK_women_in_industry_desc:0 "工場に女性労働者が進出している。"
 BLK_agrarian_modernization:0 "農業近代化"
 BLK_agrarian_modernization_desc:0 "トラクターと品種改良で農業生産が向上した。"
 BLK_arms_export:0 "兵器輸出"
 BLK_arms_export_desc:0 "連邦製の小銃と砲が近隣諸国に輸出されている。"
 BLK_state_trading:0 "連邦貿易公社"
 BLK_state_trading_desc:0 "対外貿易を一元化する公社。"
 BLK_balkan_economic_union:0 "バルカン経済同盟"
 BLK_balkan_economic_union_desc:0 "半島諸国との関税同盟。"
 BLK_reserve_system:0 "予備役制度"
 BLK_reserve_system_desc:0 "全国的な予備役制度が整備された。"
 BLK_naval_academy:0 "海軍兵学校"
 BLK_naval_academy_desc:0 "コトルの海軍兵学校が士官を養成する。"
 BLK_doctrine_defence:0 "縦深防御教義"
 BLK_doctrine_defence_desc:0 "山岳と要塞を活かした防御を基本とする教義。"
 BLK_doctrine_firepower:0 "火力優越教義"
 BLK_doctrine_firepower_desc:0 "砲兵の集中運用を基本とする教義。"
 BLK_doctrine_mobile:0 "山岳機動教義"
 BLK_doctrine_mobile_desc:0 "軽装の部隊による迅速な機動を基本とする教義。"
 BLK_total_defence:0 "総力防衛"
 BLK_total_defence_desc:0 "連邦の全住民が防衛に動員される体制。"
 BLK_macedonian_uprising:0 "マケドニア総蜂起"
 BLK_macedonian_uprising_desc:0 "マケドニアの山岳地帯でIMROの蜂起が続いている。"
 ### 設計局
 BLK_ikarus:0 "イカルス"
 BLK_ikarus_desc:0 "ゼムンの航空機工場。戦闘機と練習機を生産する。"
 BLK_rogozarski:0 "ロゴジャルスキ"
 BLK_rogozarski_desc:0 "ベオグラードの航空機工場。偵察機と軽爆撃機に強い。"
 BLK_dar_bozhurishte:0 "DAR ボジュリシュテ"
 BLK_dar_bozhurishte_desc:0 "ソフィア近郊の国営航空機工場。"
 BLK_zmaj_zemun:0 "ズマイ"
 BLK_zmaj_zemun_desc:0 "ゼムンの機械工場。装甲車両の開発に乗り出した。"
 BLK_jadranska_brodogradilista:0 "アドリア造船所"
 BLK_jadranska_brodogradilista_desc:0 "スプリトの造船所。沿岸艦艇を建造する。"
 BLK_varna_shipyard:0 "ヴァルナ海軍工廠"
 BLK_varna_shipyard_desc:0 "黒海沿岸の工廠。水雷艇と潜水艦に強い。"
 BLK_vojnotehnicki_zavod:0 "クラグイェヴァツ軍事技術廠"
 BLK_vojnotehnicki_zavod_desc:0 "旧セルビア王国軍の兵器廠。小銃と弾薬を生産する。"
 BLK_arsenal_kazanlak:0 "アルセナル（カザンラク）"
 BLK_arsenal_kazanlak_desc:0 "旧ブルガリア軍の兵器廠。砲の生産に強い。"
 BLK_tam_maribor:0 "マリボル自動車工場"
 BLK_tam_maribor_desc:0 "スロヴェニアの自動車工場。"
 BLK_trepca_mines:0 "トレプチャ鉱山会社"
 BLK_trepca_mines_desc:0 "コソヴォの鉛・亜鉛鉱山。英国資本。"
 BLK_rade_koncar:0 "ラデ・コンチャル電機"
 BLK_rade_koncar_desc:0 "ザグレブの電機会社。"
 BLK_kucova_oil:0 "クチョヴァ石油公社"
 BLK_kucova_oil_desc:0 "アルバニアの油田を運営する連邦公社。"
