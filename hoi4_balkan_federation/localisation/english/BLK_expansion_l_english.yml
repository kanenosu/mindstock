 ### 国家方針（拡張）
 blk_three_capitals:0 "三都制の確立"
 blk_three_capitals_desc:0 "ベオグラードに行政府、ソフィアに連邦議会、ザグレブに連邦最高裁判所を置く三都制を憲法に明記する。権力の分散は、連邦が一民族の国家ではないことの証明である。"
 blk_royal_marriage_diplomacy:0 "王家の縁組外交"
 blk_royal_marriage_diplomacy_desc:0 "カラジョルジェヴィチ家、サクス・コーブルク・ゴータ家（ブルガリア）、ゾグ家の縁組を周辺王家との外交に使う。"
 blk_regency_council_reform:0 "摂政評議会改革"
 blk_regency_council_reform_desc:0 "摂政評議会の権限を明文化し、ペータル2世成年までの統治を安定させる。"
 blk_orthodox_concord:0 "正教会の和解"
 blk_orthodox_concord_desc:0 "1872年以来のブルガリア総主教庁の分裂（シスマ）を解消し、セルビア総主教庁との和解を仲介する。"
 blk_entente_general_staff:0 "協商合同参謀部"
 blk_entente_general_staff_desc:0 "バルカン協商加盟国の参謀部を合同させ、半島共同の防衛計画を立てる。"
 blk_mediterranean_guarantee:0 "地中海保障の取得"
 blk_mediterranean_guarantee_desc:0 "イギリスとフランスに連邦の独立保障を求める。"
 blk_crown_of_the_balkans:0 "バルカンの王冠"
 blk_crown_of_the_balkans_desc:0 "三王評議会を恒久的な連邦王冠制度に発展させ、バルカン連邦王国を宣言する。統合度60以上が必要。"
 blk_free_press:0 "言論・結社の自由"
 blk_free_press_desc:0 "1929年以来の検閲を廃止し、政党と労働組合の結成を自由化する。"
 blk_labour_code:0 "連邦労働法"
 blk_labour_code_desc:0 "8時間労働制、団体交渉権、労働災害保険を連邦法で定める。"
 blk_womens_suffrage:0 "女性参政権"
 blk_womens_suffrage_desc:0 "連邦議会選挙に女性参政権を導入する。"
 blk_cooperative_movement:0 "協同組合運動"
 blk_cooperative_movement_desc:0 "農民党と農民同盟の伝統である協同組合を連邦規模で組織する。"
 blk_constitutional_court:0 "連邦憲法裁判所"
 blk_constitutional_court_desc:0 "ザグレブの連邦最高裁判所に憲法裁判権を与え、構成邦と連邦の紛争を司法で解決する。"
 blk_anti_fascist_front:0 "反ファシスト人民戦線"
 blk_anti_fascist_front_desc:0 "民主派と共産党が反ファシズムで共闘する。"
 blk_defend_czechoslovakia:0 "チェコスロヴァキア防衛"
 blk_defend_czechoslovakia_desc:0 "小協商の盟友チェコスロヴァキアの独立を保証する。"
 blk_eastern_democratic_bloc:0 "東欧民主圏"
 blk_eastern_democratic_bloc_desc:0 "民主バルカン同盟を東欧の民主主義諸国に広げる。"
 blk_keep_the_crowns:0 "象徴君主制"
 blk_keep_the_crowns_desc:0 "三王評議会を象徴的な元首として存続させる。"
 blk_federal_republic:0 "連邦共和国の宣言"
 blk_federal_republic_desc:0 "三王評議会を廃止し、バルカン連邦共和国を宣言する。セルビア人とアルバニア人の君主派は反発する。"
 blk_national_youth_organization:0 "国民青年団"
 blk_national_youth_organization_desc:0 "全民族の青年を連邦青年団に組織する。"
 blk_labour_service:0 "国民労働奉仕"
 blk_labour_service_desc:0 "青年に労働奉仕を義務づける。"
 blk_purge_the_ustase:0 "ウスタシャの根絶"
 blk_purge_the_ustase_desc:0 "国内のウスタシャ細胞を一掃する。クロアチア人の反発は避けられない。"
 blk_corporatist_economy:0 "協調組合経済"
 blk_corporatist_economy_desc:0 "労使を産業別組合に組織し、国家の統制下に置く。"
 blk_belgrade_general_staff:0 "ベオグラード参謀本部の優位"
 blk_belgrade_general_staff_desc:0 "セルビア将校団が連邦軍の主導権を握る。"
 blk_sofia_general_staff:0 "ソフィア参謀本部の優位"
 blk_sofia_general_staff_desc:0 "ズヴェノ将校団が連邦軍の主導権を握る。"
 blk_partition_greece_with_italy:0 "ギリシャ分割の密約"
 blk_partition_greece_with_italy_desc:0 "イタリアとギリシャの勢力圏分割を密約する。"
 blk_balkan_legion:0 "バルカン軍団"
 blk_balkan_legion_desc:0 "全民族からの志願兵による精鋭軍団を編成する。"
 blk_straits_ambition:0 "海峡への野望"
 blk_straits_ambition_desc:0 "東トラキアへの要求を掲げる。"
 blk_hungarian_reckoning:0 "ハンガリーへの報復"
 blk_hungarian_reckoning_desc:0 "マルセイユの黒幕への報復。"
 blk_balkan_empire:0 "バルカン帝国"
 blk_balkan_empire_desc:0 "半島の覇権国家として連邦を再定義する。"
 blk_popular_front:0 "人民戦線戦術"
 blk_popular_front_desc:0 "1935年コミンテルン第7回大会の方針に従い、民主派と共闘する。"
 blk_spanish_volunteers:0 "スペイン義勇兵"
 blk_spanish_volunteers_desc:0 "国際旅団に連邦の義勇兵を送る。"
