 ### イベント（拡張）
 blk.100.t:0 "ザグレブの示威"
 blk.100.d:0 "ザグレブのイェラチッチ広場に数万人が集まった。クロアチア農民党の集会は平和的だが、「クロアチア人のクロアチア」を叫ぶ声は連邦政府への明確な警告である。"
 blk.100.a:0 "集会を容認する"
 blk.100.b:0 "警察で解散させる"
 blk.101.t:0 "マチェクとの会談"
 blk.101.d:0 "クロアチア協定の調印後、マチェクはベオグラードを訪れ、摂政と会談した。協定の公示と州議会の召集が合意された。"
 blk.101.a:0 "協定を公示する"
 blk.102.t:0 "ウスタシャの爆弾"
 blk.102.d:0 "ザグレブ中央駅で爆弾が爆発した。ウスタシャの犯行声明が出ている。亡命したパヴェリッチはイタリアの庇護下にある。"
 blk.102.a:0 "イタリアに抗議する"
 blk.102.b:0 "国内の捜査を強化する"
 blk.110.t:0 "教会問題"
 blk.110.d:0 "連邦には三つの大きな宗教共同体がある。セルビアとブルガリアの正教会、クロアチアとスロヴェニアのカトリック、ボスニアとアルバニアのムスリム。どの教会との関係を優先するかは政治問題である。"
 blk.110.a:0 "ヴァチカンとの交渉を進める"
 blk.110.b:0 "正教会の統一を優先する"
 blk.111.t:0 "正教会の和解"
 blk.111.d:0 "1872年以来、ブルガリア総主教庁はコンスタンティノープル総主教庁から「分裂（シスマ）」とされてきた。連邦政府の仲介で、セルビア総主教庁がこの分裂の解消を宣言した。"
 blk.111.a:0 "ひとつの教会、ひとつの連邦"
 blk.112.t:0 "コンコルダート危機"
 blk.112.d:0 "連邦政府がヴァチカンと結んだ政教条約の批准をめぐり、セルビア正教会が猛反発している。ベオグラードでは司祭たちのデモが警察と衝突し、総主教ヴァルナヴァは批准に賛成した議員を破門すると宣言した。"
 blk.112.a:0 "批准を強行する"
 blk.112.b:0 "批准を撤回する"
 blk.112.c:0 "連邦最高裁に委ねる"
 blk.120.t:0 "ゾグ王の婚礼"
 blk.120.d:0 "ゾグ1世がハンガリーの伯爵令嬢ジェラルディン・アポニーと結婚した。ティラナでの婚礼には三王評議会の全員が出席し、連邦の一体性を示す機会となった。"
 blk.120.a:0 "三王評議会として祝賀する"
 blk.121.t:0 "コソヴォ問題"
 blk.121.d:0 "コソヴォではセルビア王国時代からのセルビア人入植が続き、アルバニア人の土地が接収されている。アルバニア構成邦はこれを連邦憲章違反だと主張し、コソヴォ委員会は武装闘争を呼びかけている。"
 blk.121.a:0 "入植を継続する"
 blk.121.b:0 "入植を停止し、土地改革を行う"
 blk.121.c:0 "コソヴォをアルバニア構成邦に編入する"
 blk.122.t:0 "イタリア人技師の退去"
 blk.122.d:0 "クチョヴァ油田のイタリア人技師が一斉に引き揚げた。ローマからの指示である。油田の操業は停止の危機にある。"
 blk.122.a:0 "連邦の技師を送る"
 blk.122.b:0 "油田を一時閉鎖する"
 blk.130.t:0 "ツァンコフ運動の集会"
 blk.130.d:0 "ソフィアで元首相アレクサンダル・ツァンコフの国民社会運動が集会を開いた。ドイツ風の制服と敬礼が目立つ。"
 blk.130.a:0 "容認する"
 blk.130.b:0 "禁止する"
 blk.132.t:0 "ボリス3世の崩御"
 blk.132.d:0 "ツァーリ・ボリス3世が急逝した。三王評議会のブルガリア代表は、幼いシメオン2世の摂政評議会が務めることになる。"
 blk.132.a:0 "ツァーリの冥福を"
 blk.140.t:0 "ミハイロフの処遇"
 blk.140.d:0 "マケドニア自治の実現で、IMRO指導者イヴァン・ミハイロフの処遇が問題になった。彼はトルコに亡命中だが、マケドニア人の間では今なお英雄である。"
 blk.140.a:0 "トルコに引き渡しを要求する"
 blk.140.b:0 "恩赦と引き換えに帰国を認める"
 blk.141.t:0 "IMROの分裂"
 blk.141.d:0 "掃討作戦でIMROの指導部は壊滅したが、組織は分裂して生き残っている。穏健なプロトゲロフ派は連邦との交渉を望んでいる。"
 blk.141.a:0 "プロトゲロフ派を取り込む"
 blk.141.b:0 "全派を追い詰める"
 blk.150.t:0 "ズボルの行進"
 blk.150.d:0 "ディミトリエ・リョティッチの「ズボル」がベオグラードで行進した。セルビアの農村保守主義とファシズムの混合物であるこの運動は、連邦を「セルビアの裏切り」と呼んでいる。"
 blk.150.a:0 "リョティッチを逮捕する"
 blk.150.b:0 "無視する"
 blk.151.t:0 "ジヴコヴィチ将軍の陰謀"
 blk.151.d:0 "内相ペータル・ジヴコヴィチ将軍がセルビア人将校と秘密会合を重ねている。セルビア人の不満を背景に、彼は「連邦のセルビア化」を要求している。"
 blk.151.a:0 "内相を更迭する"
 blk.151.b:0 "要求を一部受け入れる"
 blk.160.t:0 "ボル銅山のストライキ"
 blk.160.d:0 "フランス資本のボル銅山で大規模なストライキが起きた。労働者は賃上げと、フランス人技師の特権廃止を要求している。"
 blk.160.a:0 "仲裁する"
 blk.160.b:0 "鉱山を接収する"
 blk.161.t:0 "トレプチャの英国資本"
 blk.161.d:0 "トレプチャ鉱山会社が英国での増資に成功し、コソヴォの鉛・亜鉛鉱山の拡張が決まった。ロンドンの関心は連邦の安全保障にも及ぶ。"
 blk.161.a:0 "歓迎する"
 blk.162.t:0 "1936年の豊作"
 blk.162.d:0 "ヴォイヴォディナとドナウ平原の小麦が記録的な豊作となった。"
 blk.162.a:0 "輸出に回す"
 blk.162.b:0 "備蓄する"
 blk.170.t:0 "参謀本部の衝突"
 blk.170.d:0 "統合参謀本部の設立で、ベオグラードとソフィアの参謀たちが初めて同じ机についた。最初の議題は教範の統一だが、両者はいきなり衝突した。"
 blk.170.a:0 "セルビア式の教範を採用する"
 blk.170.b:0 "ブルガリア式の教範を採用する"
 blk.170.c:0 "フランス式の新教範を作る"
 blk.171.t:0 "ドゥブロヴニクの観艦式"
 blk.171.d:0 "連邦海軍の初の観艦式がドゥブロヴニク沖で行われた。駆逐艦ドゥブロヴニクを旗艦に、旧ユーゴ海軍と旧ブルガリア水雷艇隊が並んだ。"
 blk.171.a:0 "連邦の海"
 blk.172.t:0 "イカルスの新型機"
 blk.172.d:0 "ゼムンのイカルス工場が新型戦闘機の試作に成功した。"
 blk.172.a:0 "量産を命じる"
 blk.180.t:0 "ベルリン五輪"
 blk.180.d:0 "ベルリン・オリンピックに連邦として初めて選手団を送るかどうかが議論になった。旧三国の選手は別々の旗で参加することを望んでいる。"
 blk.180.a:0 "連邦旗の下で行進させる"
 blk.180.b:0 "参加を見送る"
 blk.181.t:0 "幹線の開通式"
 blk.181.d:0 "ソフィア＝ベオグラード幹線の複線化が完成し、三王評議会の全員が開通式に臨んだ。"
 blk.181.a:0 "鉄路が連邦を結ぶ"
 blk.200.t:0 "三王評議会の輪番"
 blk.200.d:0 "連邦憲章の定めにより、三王評議会の議長が交代する。"
 blk.200.a:0 "パヴレ摂政が議長に"
 blk.200.b:0 "ボリス3世が議長に"
 blk.200.c:0 "ゾグ1世が議長に"
 blk.205.t:0 "統合の進展"
 blk.205.d:0 "連邦の行政・通貨・教育の統合が半ばまで進んだ。連邦政府の権威は各構成邦に及び始めている。"
 blk.205.a:0 "前進を続ける"
 blk.206.t:0 "統合の完成"
 blk.206.d:0 "連邦の統合は完成した。もはや誰も、連邦を「条約の上だけの国家」とは呼ばない。"
 blk.206.a:0 "ひとつの連邦"
 blk.210.t:0 "ペータルの教育"
 blk.210.d:0 "若き王ペータルの教育方針が摂政評議会で議論された。"
 blk.210.a:0 "ベオグラードの士官学校へ"
 blk.210.b:0 "イギリスへ留学させる"
 blk.210.c:0 "三都を巡る連邦教育を"
 blk.212.t:0 "王家の縁組"
 blk.212.d:0 "連邦の王家の縁組先が議論されている。"
 blk.212.a:0 "ギリシャ王家と"
 blk.212.b:0 "ルーマニア王家と"
 blk.212.c:0 "連邦内のブルガリア王家と"
 blk.230.t:0 "バルカン連邦からの提案"
 blk.230.d:0 "バルカン連邦の軍事評議会が、ギリシャの勢力圏分割を提案してきた。イタリアはエピルスとエーゲ海の島々を、連邦はマケドニアとトラキアを。"
 blk.230.a:0 "密約を結ぶ"
 blk.230.b:0 "拒否する"
 blk.231.t:0 "連邦の海峡への野望"
 blk.231.d:0 "バルカン連邦が東トラキアへの要求を公然と掲げた。"
 blk.231.a:0 "国境を固める"
 blk.232.t:0 "連邦の介入"
 blk.232.d:0 "バルカン連邦が国内の共産党を公然と支援し、武器と資金を送っている。"
 blk.232.a:0 "弾圧する"
 blk.232.b:0 "共産党を政権に入れる"
 blk.233.t:0 "ミハイロフの引き渡し要求"
 blk.233.d:0 "バルカン連邦がIMRO指導者イヴァン・ミハイロフの引き渡しを要求してきた。"
 blk.233.a:0 "引き渡す"
 blk.233.b:0 "庇護を続ける"
 blk.250.t:0 "クロアチア蜂起"
 blk.250.d:0 "クロアチアの不満が限界に達した。ザグレブで連邦の官庁が襲撃され、各地で武装蜂起が起きている。ウスタシャも農民党の急進派も、それぞれの旗を掲げて立ち上がった。"
 blk.250.a:0 "戒厳令と武力鎮圧"
 blk.250.b:0 "クロアチアに広範な自治を認める"
 blk.251.t:0 "ブルガリア分離の危機"
 blk.251.d:0 "ソフィアの駐屯部隊が連邦からの離脱を宣言した。ブルガリア人の不満を背景に、将校たちは「ブルガリアの復活」を叫んでいる。"
 blk.251.a:0 "反乱を鎮圧する"
 blk.251.b:0 "ブルガリアに特別な地位を認める"
 blk.252.t:0 "アルバニア反乱"
 blk.252.d:0 "アルバニア北部の部族が蜂起した。イタリアの武器が山岳地帯に流れ込んでいる。"
 blk.252.a:0 "憲兵隊を投入する"
 blk.252.b:0 "ゾグ王と再交渉する"
 blk.253.t:0 "マケドニア総蜂起"
 blk.253.d:0 "マケドニア全土でIMROの蜂起が始まった。山岳地帯は反乱軍の手に落ちている。"
 blk.253.a:0 "軍を投入する"
 blk.253.b:0 "自治と恩赦で収拾する"
 blk.254.t:0 "ベオグラードの将校クーデタ"
 blk.254.d:0 "セルビア人将校の一団が王宮を包囲した。彼らは「連邦のセルビア化」と将校団政権を要求している。"
 blk.254.a:0 "忠誠な部隊で鎮圧する"
 blk.254.b:0 "将校団の要求を呑む"
 blk.260.t:0 "連邦の危機"
 blk.260.d:0 "連邦内務省の報告によれば、いずれかの民族の不満が危険な水準に達している。このまま放置すれば、蜂起や分離の動きが起こりかねない。連邦評議会の決定で対処せよ。"
 blk.260.a:0 "対処する"
 blknews.10.t:0 "バルカン連邦王国の宣言"
 blknews.10.d:0 "バルカン連邦は三王評議会を恒久的な連邦王冠制度に発展させ、バルカン連邦王国を宣言した。"
 blknews.10.a:0 "王冠の連邦"
 blknews.11.t:0 "バルカン連邦共和国の宣言"
 blknews.11.d:0 "バルカン連邦は三王評議会を廃止し、連邦共和国を宣言した。三人の王は象徴的な地位さえ失った。"
 blknews.11.a:0 "共和国の誕生"
