org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true

# Windows: プロジェクトとGradleのpub-cache（例: D:\... と C:\Users\...）が
# 別ドライブにあると、Kotlinのincremental compilerが相対パスを計算できずに
# "this and base files have different roots" で毎回コンパイルクラッシュする。
# incrementalを切って毎回フルコンパイルにすることで回避する（ビルドは少し遅くなる）。
kotlin.incremental=false
