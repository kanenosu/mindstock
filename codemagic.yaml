workflows:
  ios-demo:
    name: iOS デモ版ビルド (TestFlight配布)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        # Codemagic の Team settings > Environment variables で作成し、
        # このワークフローに紐付けること。中身は App Store Connect API キー。
        - app_store_credentials
      vars:
        BUNDLE_ID: "com.kanenosu.mindstock"
        XCODE_WORKSPACE: "ios/Runner.xcworkspace"
        XCODE_SCHEME: "Runner"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: "*"
          include: true
    scripts:
      - name: Set up code signing (App Store Connect 自動署名)
        script: |
          xcode-project use-profiles
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      - name: Install CocoaPods dependencies
        script: |
          find . -name "Podfile" -not -path "*/build/*" -execdir pod install \;
      - name: Flutter build ipa
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # ベータ版としてすぐ配布したい場合はテストグループ名を指定する:
        # beta_groups:
        #   - "デモ版テスター"
