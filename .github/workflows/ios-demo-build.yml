name: iOS デモ版ビルド（署名なし）

# 手動実行のみ。Sideloadly / AltStore などで無料のApple IDを使って
# 端末に直接インストールするための、コード署名なしIPAを作る。
on:
  workflow_dispatch:

jobs:
  build-unsigned-ipa:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Flutterをセットアップ
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: パッケージ取得
        run: flutter pub get

      - name: Xcodeプロジェクトを準備（ビルドはしない）
        run: flutter build ios --release --no-codesign --config-only

      - name: xcodebuildで署名なしビルド
        run: |
          set -e
          cd ios
          xcodebuild \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            EXPANDED_CODE_SIGN_IDENTITY="-" \
            build

      - name: 署名なしIPAにパッケージング
        run: |
          set -e
          cd ios/build/Build/Products/Release-iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/Runner.app
          zip -r -y mindstock-unsigned.ipa Payload

      - name: IPAをアーティファクトとしてアップロード
        uses: actions/upload-artifact@v4
        with:
          name: mindstock-unsigned-ipa
          path: ios/build/Build/Products/Release-iphoneos/mindstock-unsigned.ipa
          retention-days: 14
