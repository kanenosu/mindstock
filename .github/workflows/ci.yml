name: CI（analyze + test）

# push / PR のたびに flutter analyze と flutter test を自動実行する。
# 手元で流し忘れても、壊れた変更が入ればここで気づける（改善点§8）。
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Flutterをセットアップ
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.5"
          cache: true

      - name: パッケージ取得
        run: flutter pub get

      - name: フォーマット確認
        run: dart format --output=none --set-exit-if-changed lib test

      - name: 静的解析
        run: flutter analyze

      - name: テスト
        run: flutter test
