name: mindstock
description: "人生チャート日記アプリ — 日記を書くだけで人生がローソク足チャートになる"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  sqflite: ^2.4.1
  path: ^1.9.0
  http: ^1.2.2
  shared_preferences: ^2.3.3
  intl: ^0.20.2
  cupertino_icons: ^1.0.8
  record: ^6.2.1
  path_provider: ^2.1.5
  google_sign_in: ^6.3.0
  google_mobile_ads: ^6.0.0
  in_app_purchase: ^3.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  sqflite_common_ffi: ^2.3.6

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

# アプリアイコン（`dart run flutter_launcher_icons` で iOS/Android の
# 全サイズを生成する。ローソク足2本 + きらめき、テーマカラーそのまま）。
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon_1024.png"
  adaptive_icon_background: "#F7F1E8"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground_1024.png"
  remove_alpha_ios: true
